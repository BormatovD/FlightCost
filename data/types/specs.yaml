# значение — как в обзоре, текстом («≈44,3 т», «150 / 180»), с пометкой
# оценки (`est`) и лучшего в строке ВНУТРИ своего обзора (`best`).
# Источники — у обзора в availability.yaml.
#
# Названия строк в обзорах разных классов немного различаются; здесь они
# сведены к одному перечню, чтобы A220 и A320 в одном отчёте стояли в
# одной таблице. Пометка `best` при сравнении типов из РАЗНЫХ обзоров
# не показывается: лучшее среди шести узких не значит лучшее среди
# других.
