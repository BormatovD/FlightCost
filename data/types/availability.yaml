    - Duncan Aviation, «The current aftermarket for the Bombardier Global 5000» (май 2026) — парк ≈232, производство остановлено в 2019, цены $9–20 млн
    - AvBuyer, «Global 5000 price guide» (Aircraft Bluebook / JETNET) — Bluebook $23,5–31,5 млн за 2016–2020 г.в., парк 238, расхождение с объявлениями ≈$10,5–11,5 млн
    - GlobalAir.com, «Gulfstream G650 vs G550» (сентябрь 2026) — цены G550 $15–35 млн и G650 $43–53 млн, часовая стоимость $9 483 и $10 547, конец выпуска G550 (июль 2021)
    - 'GlobalAir.com, «Gulfstream stopped building the G650» (2026) — последний G650 в феврале 2025, рынок: ≈2 борта в продаже в начале 2026'
    - Wikipedia, «Gulfstream G650/G700/G800» (июнь 2026) — 598 G650 построено, размеры, веса, инцидент в Розуэлле 2011, G700 (сертификат март 2024) и G800 (апрель 2025)
