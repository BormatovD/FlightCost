# Доступность типов: что реально можно получить (отчёт по парку, Ф5).
#
# Не расчёт и не данные ядра: это сведения о рынке поставок —
# производство, сертификация, двигатели, санкции, цены. Перенесены из
# четырёх обзоров владельца (данные на 30.09.2026) вместе со списками
# источников, без пересказа. Отчёт показывает блок рядом с расчётом и
# в расчёт его не заводит: цена борта здесь — рынок, а ставка лизинга в
# расчёте — своя у каждого типа, с происхождением.
#
# Блок стареет быстрее всего остального в проекте: дата — в каждом
# отчёте, а `review_by` — срок, после которого отчёт пишет «сведения
# старше полугода».
#
# Поля типа:
#   match   — ключи хранилища (ИКАО), совпадение целиком
#   names   — подстроки ключа или названия СВОЕГО типа (USER:…): «Ту-214»
#             в названии узнаёт Ту-214; у западных типов их нет нарочно —
#             «A320» в названии «A320neo» узнал бы не тот тип
#   status  — одной строкой, как в обзоре
#   kind    — production | waiting | secondary | ended | restricted:
#             цвет метки и правило «можно ли заказать сегодня»
#   points  — абзацы обзора
#   price   — цена борта, как в обзоре, и пояснение к ней

