    - Jetcraft, «Gulfstream G550 Overview» и «Global 5000 Overview» — BOW, MLW, взлётная и посадочная дистанции, парк
    - AeroCorner, «Bombardier Global 5000» — геометрия, салон, топливо 22,2 тыс. л, payload
    - Privatejetcardcomparisons.com, «Bombardier Global 5500» — 5500 в серии с 2020 г., цена нового ≈$46–48 млн (вторичный источник)
    - Jetcraft, «Cessna Citation CJ2 Overview» и «CJ1 Overview» — веса, взлёт и посадка, парк (CJ1 — 198, CJ2+ — 226)
    - Wikipedia, «Cessna 525 / CitationJet-M2» — серийные номера, конец выпуска CJ2 в январе 2016, цена CJ2+ $7,044 млн (2012), M2 $6,15 млн (2023), катастрофа в Линате
    - GlobalAir.com, «Citation CJ1+» (октябрь 2026), «Citation XLS» (октябрь 2026), «Citation S/II» — топливо, дистанции, часовая стоимость XLS $4 916
    - Wikipedia, «Cessna Citation II» и «Cessna Citation Excel» — размеры, веса, тяга, число построенных, катастрофа 2014 г., цены 2018
    - 'Aviation Week, «Aircraft Overview: Citation 560XL Series» — топливо 6 740 фунтов, сертификация XLS Gen2 (22.04.2022) и Ascend (05.11.2025); Jetaviva, «Citation Ascend» — Ascend $17–19 млн, поставки с января 2026'
    - AircraftCostCalculator, «Citation XLS Gen2» — выпуск с 2022 г., средняя цена б/у $14,5 млн, ≈$5 350/ч
    - Wikipedia, «Learjet 45» + Avi-Go, «Learjet aircraft models, prices, performance» + FlyRadius, «Learjet 45 specifications» — размеры, веса, топливо; конец выпуска (последний Learjet 75 — март 2022); б/у $1,5–5 млн
    - Wikipedia, «Pilatus PC-24» + SkyAccess — размеры, веса, взлёт/посадка, сертификация, цена $12,2 млн (2023)
