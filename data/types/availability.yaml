types:
  A320:
    name: A320ceo
    full_name: "Airbus A320ceo"
    tagline: "1988 · CFM56-5B / V2500 · 150–180 кресел · выпуск завершён в 2021, ~4 800 в эксплуатации"
    match: [A320]
    review: narrowbody
    status: Только вторичный рынок
    kind: secondary
    points:
      - "Производство ceo завершено в 2021; парк ≈4 800 бортов, средний возраст растёт."
      - "Лизинговые ставки на 12-летние машины упали с пика $253 тыс. (июль 2025) до $220 тыс./мес (IBA, август 2026) — но всё ещё это самый дешёвый способ получить 180 кресел сегодня."
      - "Двигатели CFM56-5B и V2500 — зрелые, с огромной вторичной базой; ценность планера всё больше определяется остатком ресурса двигателей."
      - "Для РФ — единственный реальный источник A320-класса: «серый» вторичный рынок и каннибализация."
    price: "$15–22 млн"
    price_note: "2012–2015 г.в., оценка; лизинг ≈$220 тыс./мес"
  A20N:
    name: A320neo
    full_name: "Airbus A320neo"
    tagline: "2016 · LEAP-1A / PW1100G · 150–194 · портфель семейства 5 500+, слоты на 2030-е"
