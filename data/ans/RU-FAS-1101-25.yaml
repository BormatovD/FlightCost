# Выписка из приказа ФАС России от 16.12.2025 № 1101/25 «Об утверждении
# ставок сборов за аэронавигационное обслуживание полётов воздушных судов
# пользователей воздушного пространства Российской Федерации». Скан без
# текстового слоя, 33 страницы, 11 приложений; выписаны приложения 5, 6
# (маршрутные, российские пользователи) и 7, 9 (терминальные, RUB и USD)
# для аэродромов, заведённых в тарифах. Приложения 1–4 (маршрутные для
# иностранных без договоров, по периодам) и 8, 10, 11 не выписаны.
#
# Отменил приказ ФАС от 30.08.2024 № 595/24. Регулятор — ФАС, платит
# пользователь Госкорпорации по ОрВД.
source: "Приказ ФАС России от 16.12.2025 № 1101/25, зарегистрирован Минюстом 26.01.2026, рег. № 85074"
source_url: "https://fas.gov.ru/"
publisher: "ФАС России"
valid_from: "2026-01-26"
# Дата вступления в силу — прочтение: приказ зарегистрирован 26.01.2026 и
# вступает в силу по общему порядку через 10 дней после публикации; сама
# публикация не датирована в выписке. Долларовые приложения датированы
# периодами явно, рублёвые — нет.

