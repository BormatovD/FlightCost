# Курс тенге. ЕЦБ его не котирует, поэтому объявляем с издателем.
#
# Издатель — Национальный банк Республики Казахстан: официальный курс, по
# которому ведётся бухгалтерия в стране и к которому привязаны счета
# аэропорта Алматы. Котировки прочитаны через публикации, ссылающиеся на
# nationalbank.kz (новостные ленты и агрегаторы курсов) — при следующем
# обновлении сверить с самой страницей Нацбанка.
#
# КУРС ДВИЖЕТСЯ БЫСТРО. С 1 октября 2025 по 30 сентября 2026 евро подешевел
# с 644,87 до 498,60 тенге — почти на четверть. Расчёт берёт последнюю
# известную котировку на дату (решение 23), поэтому котировки нужны и на
# сегодня, и около даты вступления тарифа Алматы: иначе тариф прошлого года
# пересчитается по сегодняшнему курсу, и ошибка будет в те же четверть.
#
# Следующий шаг, когда тенге понадобится чаще раза в квартал: RSS Нацбанка
# с курсами на дату — детерминированный источник того же рода, что ЕЦБ.
