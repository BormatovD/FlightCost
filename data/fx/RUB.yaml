# Курс рубля. ЕЦБ его не котирует, поэтому объявляем с источником.
#
# ДВА ВИДА КУРСА, И ОНИ НЕ ВЗАИМОЗАМЕНЯЕМЫ. Средний за год нужен годовым
# величинам отчётности: расходы накоплены за период, и курс на отчётную
# дату к ним не относится. Котировка на дату нужна всему остальному —
# цене билета, ставке сбора, разовому платежу.
#
# Смешать их значит получить ошибку того же рода, что была со строкой
# ТОиР: величина настоящая, период другой.
