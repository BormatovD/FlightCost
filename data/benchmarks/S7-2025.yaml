# Выписка из двух документов на один контур: операционные показатели —
# из отчёта об устойчивом развитии (таблица SASB TR-AL), деньги — из
# бухгалтерской отчётности по РСБУ, выгруженной из ГИР БО ФНС. S7 не
# публичная компания, МСФО не публикует; РСБУ — единственная официальная
# финансовая отчётность, и она агрегированная: статей затрат нет,
# есть себестоимость, коммерческие и управленческие расходы.
#
# CASK, доход с пассажира, плечо, топливо в тоннах — не заводятся,
# выводятся расчётом (см. заголовок LH-2025.yaml).
---
carrier: S7
name: S7 Airlines (АО «Авиакомпания «Сибирь»)
year: 2025
source: >
  Отчёт об устойчивом развитии S7 за 2025 год, приложение «Таблица
  соответствия отчёту стандартам SASB» (TR-AL, стр. 157–158);
  Бухгалтерская (финансовая) отчётность АО «Авиакомпания «Сибирь»
  (ИНН 5448100656) за 2025 год, ГИР БО ФНС России, выгрузка от 17.09.2026,
  подписана УКЭП ФНС
source_url: https://bo.nalog.ru
scope: >
  АО «Авиакомпания «Сибирь» — одно юрлицо; SASB-показатели — S7 Airlines
  как перевозчик. Границы РСБУ: выручка (стр. 2110) включает всё — грузы,
  прочие доходы от основной деятельности; операционные расходы собраны
  как себестоимость продаж (2120) + коммерческие (2210) + управленческие
  (2220), БЕЗ прочих расходов (2350: курсовые разницы, резервы) и без
  процентов. Аренда учитывается через «право пользования объектами
  аренды» в основных средствах, то есть амортизацией внутри
  себестоимости — контур близок к МСФО 16 у Аэрофлота, а не к «арендатор
  без капитализации».
