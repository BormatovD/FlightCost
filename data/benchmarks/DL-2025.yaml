scope: 'Delta Air Lines, Inc. consolidated: mainline + региональные партнёры по capacity
  purchase (Endeavor — дочерняя; SkyWest, Republic — CPA); выручка и расходы включают
  сторонние продажи НПЗ Monroe (refinery) и MRO Региональные (capacity purchase) включены:
  regional carrier expense 2 553 млн USD в opex; сноска 10-K к таблице топлива — включает
  регионалов. Revenue/opex содержат сторонние продажи НПЗ (≈1,70¢/ASM ≈ 5,07 млрд
  USD) — для CASK без топлива использовать CASM-Ex или вычесть. Рейсы, блок-часы,
  длина рейса, средний парк, кресла не публикуются в релизе; доступная часть 10-K
  (первые ~116 тыс. симв.) их не содержит.'
