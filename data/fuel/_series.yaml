# Открытые ряды цены топлива; новые месяцы — агент «топливо» (fca master drafts --accept-fuel).
method: 'Открытые ряды цены топлива по регионам (план fuel-regions, 09.11.2026). ratio — цена «в крыло» по учёту
  перевозчиков, k = цена ÷ средняя USGC за окно spot_window месяцев (этот и предыдущие), медиана по smooth последним
  точкам; расчёт — спот дня × k. direct — местная цена, оторванная от USGC: без НДС × (1 + наценка ТЗК группы) +
  сбор за тонну ÷ курс; демпфер вычитается отдельно (_ru_damper.yaml). Точка старше max_age_months на дату расчёта
  не берётся — тогда множитель региона из _regional.yaml. Новые месяцы дописывает агент «топливо» через fca master
  drafts.'
series:
  us_p12a:
    name: США — стоимость галлона у перевозчиков (BTS, Form 41 P-12(a), регулярные рейсы)
    mode: ratio
    unit: USD_per_gallon
    spot_window: 2
    smooth: 3
    max_age_months: 4
    confidence: средняя
    regions:
      north_america: {}
    home: https://www.bts.gov/newsroom
    find: 'ежемесячный пресс-релиз BTS «U.S. Airlines <месяц> <год> Aviation Fuel Cost …»: фраза «The cost per gallon
      of fuel in <месяц> ($X.XX)»'
    note: Все регулярные рейсы перевозчиков США (внутренние и международные), учётная стоимость с налогами и заправкой.
      Отстаёт от спота примерно на месяц (договоры по средней прошлого периода, запасы), поэтому делится на среднюю
      USGC за этот и прошлый месяц; в резкий рост цены k проседает ниже 1 — сглаживает медиана трёх месяцев. Хеджирование
      в учёте перевозчика не отделено.
    points:
      2025-03:
        value: 2.41
