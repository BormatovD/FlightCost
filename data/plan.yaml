      en: "The most frequent uncovered search query to the site per Search Console. Lease in the calculator is now parametric from weight; a rate by type and age with a source is needed."
      de: "Laut Search Console die häufigste nicht abgedeckte Suchanfrage. Leasing im Rechner ist derzeit parametrisch nach Masse; gebraucht wird ein Satz nach Typ und Alter mit Quelle."
