  - id: network-calc
    status: done
    area: calc
    title:
      ru: "Расчёт сети по исследованиям: налёт по типу сети вместо 300 ч, экипажи от годовых часов, резерв и плановое ТО явными долями"
      en: "Network calculation from the research: utilisation by network type instead of 300 h, crews from annual hours, reserve and scheduled maintenance as explicit shares"
      de: "Netzberechnung nach den Recherchen: Auslastung nach Netztyp statt 300 h, Crews aus Jahresstunden, Reserve und planmäßige Wartung als eigene Anteile"
    note:
      ru: "Сделано 09.11.2026: налёт из плеч сети по окну базы × годовой коэффициент типа сети (по Form 41 T-2: челнок 0,81, хаб 0,74, лоукост 0,52), экипажи от годовых часов и проверка смен, резерв и тяжёлое ТО долями. Ночные ограничения аэропортов — справочник, его по вторникам пополняет агент; запрет базы сужает окно."
      en: "Done 9 Nov 2026: utilisation from the network's sectors within the base window × the annual factor of the network type (from Form 41 T-2: shuttle 0.81, hub 0.74, low-cost 0.52), crews from annual hours with a duty check, reserve and heavy maintenance as shares. Airport night restrictions — a reference file an agent extends every Tuesday; a ban at the base narrows the window."
      de: "Erledigt am 09.11.2026: Auslastung aus den Strecken im Basisfenster × Jahresfaktor des Netztyps (nach Form 41 T-2: Pendel 0,81, Hub 0,74, Low-Cost 0,52), Crews aus Jahresstunden mit Dienstprüfung, Reserve und schwere Wartung als Anteile. Nachtbeschränkungen der Flughäfen — Stammdaten, die ein Agent jeden Dienstag ergänzt; ein Verbot an der Basis verengt das Fenster."
    by: owner
    via: owner
    added: 2026-11-09
    done: 2026-11-10
    link: /ru/research/network-2026-10

  - id: toir-calc
    status: done
    area: calc
    title:
      ru: "ТОиР по возрасту борта и рост ставок во времени; новые типы — расчёт «снизу» с поправкой факт/каталог"
      en: "Maintenance by aircraft age and rate growth over time; new types bottom-up with an actual-to-catalogue factor"
      de: "Instandhaltung nach Flugzeugalter und Kostenwachstum; neue Typen von unten mit Faktor Ist/Katalog"
    by: owner
    via: owner
    note:
      ru: "Сделано 10.11.2026: ставка типа по Form 41 (36 типов), возраст борта полем калькулятора, +3 % в год, новые типы по предшественнику × 0,7 (пары B38M/B738, B39M/B739, A21N/A321). Проверка: Southwest −2 %, Frontier +14 % — у сверхлоукостеров ТОиР дешевле среднего перевозчика США. Расчёт «снизу» по каталогу двигателя — позже."
      en: "Done 10 Nov 2026: type rate from Form 41 (36 types), aircraft age as a calculator field, +3 % a year, new types from their predecessor × 0.7 (pairs B38M/B738, B39M/B739, A21N/A321). Check: Southwest −2 %, Frontier +14 % — ultra-low-cost carriers maintain cheaper than the average US carrier. Bottom-up from engine catalogues — later."
      de: "Erledigt am 10.11.2026: Typsatz aus Form 41 (36 Typen), Flugzeugalter als Rechnerfeld, +3 % pro Jahr, neue Typen nach dem Vorgänger × 0,7 (Paare B38M/B738, B39M/B739, A21N/A321). Prüfung: Southwest −2 %, Frontier +14 % — Ultra-Low-Cost-Airlines warten günstiger als die durchschnittliche US-Airline. Bottom-up aus Triebwerkskatalogen — später."
    added: 2026-11-09
    done: 2026-11-10
    link: /ru/research/toir

