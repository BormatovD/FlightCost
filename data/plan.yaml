# План работ — страница /{lang}/monitor, вкладка «План работ».
#
# Правится руками, коммитом в репозиторий. Предложение из бота после приёмки
# приходит владельцу готовой записью (бот, вид «Предложение в план работ») —
# её остаётся вставить сюда.
#
# Поля:
#   id      — короткий постоянный идентификатор (латиница, цифры, дефис);
#   status  — now (в работе) | next (дальше) | later (когда-нибудь) | done (сделано);
#   area    — calc (расчёт) | data (данные) | research (исследования) | site (сайт) | community (сообщество);
#   title   — ru обязателен, en и de — желательно (без них показывается ru);
#   note    — одна-две фразы: зачем; тоже ru/en/de;
#   by      — кто предложил: owner (автор проекта) или подпись автора, как он сам её указал в боте;
#   via     — откуда пришло: owner | bot #N | github #N;
#   added   — дата, когда попало в план; done — дата, когда сделано (для status: done).
#   link    — необязательно: адрес статьи, решения или issue.

