# Манифест проекта. Один файл описывает: что это, от чего зависит,
# какие команды появляются в системе. Заменяет собой связку
# setup.py + requirements.txt + setup.cfg из старого мира.

[build-system]
# Чем собирать пакет. Без этой секции pip угадывает и иногда угадывает
# неправильно — лучше сказать явно.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flightcostapp"
version = "0.1.0"
description = "Open route economics engine with reproducible reference-data snapshots"
requires-python = ">=3.11"          # dataclasses + синтаксис `str | None`
license = "Apache-2.0"
license-files = ["LICENSE", "DATA-LICENSE", "NOTICE"]
# ЗАЯВЛЕННОЕ И ДЕЙСТВИТЕЛЬНОЕ РАСХОДИЛИСЬ и молчали об этом. Три
# библиотеки использовались и не были объявлены: shapely, pyshp, pypdf.
# Работало потому, что они стояли в окружении, поставленные когда-то
# руками, — то есть проект зависел от состояния машины, а не от своего
# описания. Вскрылось при пересоздании `.venv`, случайно, а не проверкой.
#
# Скрывал расхождение ЛЕНИВЫЙ ИМПОРТ: почти все внешние модули
# подключаются внутри функций, а не на уровне файла. Пакет
# импортируется, `--help` работает, и отсутствие библиотеки всплывает
# только на конкретном пути расчёта. Приём полезный — он держит запуск
# быстрым, — но платой стало то, что проверка «импортируется ли пакет»
# ничего не проверяет.
dependencies = [
    "openap>=2.0",                  # расход топлива по фазам полёта — с M2 обязателен
    "pyyaml>=6.0",                  # чтение registry.yaml
    "requests>=2.31",               # загрузка источников
    "shapely>=2.0",                 # пересечение маршрута с полигонами зон, M6
    "pyshp>=2.3",                   # шейпфайл границ FIR; модуль зовётся `shapefile`
    "pypdf>=4.0",                   # терминальные ставки CRCO приходят PDF
    # Перечень аэропортов, который ведёт владелец, — xlsx, и его читает
    # ПАРСЕР, а не инструмент. Граница проходит по тому, ломает ли
    # отсутствие библиотеки контур или только вспомогательный скрипт:
    # пока openpyxl был нужен только `tools/make_routes.py`, ему было
    # место в необязательных. Как только его импортировал
    # `parsers/airport_watch.py`, он стал обязательным — `fca refresh
    # --all` зовёт все парсеры.
    #
    # Сдвиг границы поймала проверка `tests/test_deps.py`, а не человек.
    "openpyxl>=3.1",                # перечень аэропортов и выгрузки xlsx
]

# Обязательны ВСЕ, а не часть. Соблазн вынести `pypdf` и `pyshp` в
# необязательные велик: они нужны двум парсерам из десяти. Но
# `fca refresh --all` зовёт все парсеры, и отсутствие любого превратится
# в `error:parse` у одного источника посреди успешного прогона — то есть
# в тихий пробел покрытия. Разделять их можно будет, когда источники
# станут подключаться выборочно.

# Вспомогательные скрипты в tools/ — не контур. `collect_prices.py` тянет
# pandas ради одной группировки; ставить pandas каждому, кто хочет посчитать
# маршрут, незачем. Граница та же, что у openpyxl выше: ломает ли отсутствие
# библиотеки контур или только скрипт рядом с ним. `tests/test_deps.py`
# считает необязательные группы объявленными.
[project.optional-dependencies]
tools = [
    "pandas>=2.0",
    "python-dateutil>=2.8",
]

[project.scripts]
# Из-за этой строки после установки в системе появляется команда
# `fca`, которая зовёт функцию main() из модуля flightcostapp.cli
fca = "flightcostapp.cli:main"

[tool.setuptools.package-data]
# Страница витрины и реестр лежат ВНУТРИ пакета и обязаны уехать вместе
# с ним. Без этой секции `pip install .` соберёт только `.py`, и
# `fca serve` упадёт на чтении `web/serve.html` — тем же способом, что и
# shapely: работает у автора, не работает у собравшего.
# Шрифты — часть оформления и уезжают вместе с ui.css: без них `fca serve`
# отдаст 404 на /fonts/, а статические страницы вшивать будет нечего.
flightcostapp = ["web/*.html", "web/*.js", "web/*.css",
                 "web/fonts/*.woff2", "web/fonts/LICENSE.txt", "*.yaml"]

[tool.setuptools.packages.find]
# Какие папки считать пакетами. Без этого setuptools попытается
# запаковать ещё и tests/ и config/.
include = ["flightcostapp*"]
