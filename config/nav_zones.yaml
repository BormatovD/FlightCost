# Способ расчёта сбора за аэронавигацию по зонам вне EUROCONTROL.
#
# Зоны, которых здесь нет, считаются по правилу EUROCONTROL — это верно
# для всех сорока одного государства его зоны и является разумным
# приближением для соседей. Ставка при этом всё равно нужна отдельно,
# так что пробел не спрячется.
#
# Заполняется по мере появления маршрутов: заводить весь мир заранее
# бессмысленно, как и с аэропортовыми тарифами.

zones:
  # --- США и Канада ---
  # Пролётные сборы FAA берутся только с рейсов, не садящихся в стране.
  # Внутренние рейсы за аэронавигацию не платят: она финансируется
  # налогами на билеты и топливо. Поэтому "none" здесь — факт, а не пробел.
  KK: {formula: per_100nm, note: "пролётный сбор FAA, только транзит"}
  CZ: {formula: per_100nm, note: "NAV CANADA, ставка за расстояние"}
  CC: {formula: per_100nm, note: "NAV CANADA"}

  # --- СНГ ---
  # Казахстан: P = T x (S/100), ставка за каждые 100 км, масса не входит.
  # Проверено по AIP GEN 4.1, AIRAC 11 JUN 2026.
  UA: {formula: distance_only, note: "Казахстан, AIP GEN 4.1: T x S/100"}
  UT: {formula: distance_only, note: "Узбекистан и Средняя Азия, уточнить"}
  UM: {formula: distance_only, note: "Беларусь, уточнить"}

# Не заполнено намеренно: Африка, Ближний Восток, Азия. Для них нужен
# разбор AIP, и делать это стоит под конкретный маршрут, а не впрок.

  # --- Россия ---
  # Приказ ФАС № 1101/25: ставка за 100 км ортодромии по полосам МВМ,
  # отдельно для внутренних и международных полётов и для иностранных без
  # договоров. Прежняя запись «плоский сбор за вход, расстояние не влияет»
  # была НЕВЕРНА ПО ФОРМЕ, не только по величинам. Полосы и валюта лежат в
  # фактах enroute_rate (источник fas_ans_rates), здесь — только форма;
  # ключ факта — <зона>/<operator>/<flight>.
  UU: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0,
       note: "Россия, за 100 км по полосе МВМ; ставка из приказа ФАС"}
  UL: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Санкт-Петербург"}
  UR: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Ростов"}
  US: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Екатеринбург"}
  UN: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Новосибирск"}
  UW: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Самара"}
  UH: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Хабаровск"}
  UI: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Иркутск"}
  UE: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Якутск"}
  UO: {formula: custom, d_div: 100, d_unit: km, d_exp: 1, m_exp: 0, note: "Россия, Тикси"}

  # --- Китай ---
  # Плоская ставка за километр для иностранных ВС, масса не входит.
  # Зона Санья считается по заметно меньшей ставке. Гонконг и Макао
  # имеют собственные правила и здесь не отражены.
  ZB: {formula: distance_only, note: "Китай, ставка за км, масса не входит"}
  ZG: {formula: distance_only, note: "Китай, юг"}
  ZS: {formula: distance_only, note: "Китай, восток"}
  ZY: {formula: distance_only, note: "Китай, север"}
  ZJ: {formula: distance_only, note: "Санья, ставка ниже прочих зон"}

  # --- Таиланд ---
  # Та же форма, что у EUROCONTROL, но делитель расстояния 250 км,
  # и минимум 250 км на пролёт. Проверено по AIP GEN 4.2.
  VT: {formula: thailand, note: "AIP Thailand GEN 4.2, D/250 км, минимум 250 км"}

  # --- Грузия ---
  # Счета выставляет CRCO, но правила собственные. Терминальный сбор
  # с весовым коэффициентом, отличным от общеевропейского.
  UG: {formula: eurocontrol, note: "биллинг через CRCO, правила свои"}

# Индия и Малайзия: формула найдена (MTOW и расстояние в FIR), ставки не
# разобраны. Заводить под конкретный маршрут.
