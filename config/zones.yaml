# Тарифные зоны CRCO — справочная таблица, кодом ключуется домен enroute_rate.
#
# Ключ зоны совпадает с первыми двумя буквами кода ИКАО аэропорта, поэтому
# отдельный маппинг «страна → зона» не нужен: EDDF → ED, LEBL → LE,
# GCLP → GC. Именно так CRCO и определяет зоны.
#
# Файл не читается кодом. Он существует, чтобы через полгода было понятно,
# почему у Испании две ставки, и чтобы было куда заглянуть при разборе
# расхождений.

zones:
  # Государства с несколькими зонами — источник самых частых ошибок
  ES: [LE, GC]        # континент и Канары; разница в 2026 году 71.30 против 53.40
  PT: [LP, AZ]        # Лиссабон и Санта-Мария (океаническая, 8.16 — самая дешёвая)
  UA: [UK, U1]        # основная и южная

  # Прочие — одна зона на государство
  DE: [ED]
  FR: [LF]
  IT: [LI]
  NL: [EH]
  BE: [EB]            # общая зона Бельгии и Люксембурга
  CH: [LS]
  GB: [EG]
  AT: [LO]
  PL: [EP]
  GR: [LG]
  MT: [LM]
  MD: [LU]

# Заметка на будущее: в файле ставок 41 зона, а сбор берётся за пролёт
# каждой из них. Пока модель считает только зоны вылета и прилёта —
# транзитные не учитываются вовсе. Исправляется на M6.
