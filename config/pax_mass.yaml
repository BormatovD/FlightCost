# Расчётная масса пассажира с багажом, кг.
#
# Не константа: зависит от типа перевозки. На регионалах багажа меньше и
# норма провоза жёстче, на дальних плечах наоборот. Разница в 10 кг при
# полутора сотнях кресел — это полторы тонны, то есть заметная часть
# полезной нагрузки.
#
# Значения по трём первым строкам — из практики (техники и планировщики
# перевозчиков). Дальнемагистральная строка помечена как допущение:
# в источнике её не было, а норма провоза багажа там выше, так что 100
# скорее занижает.

by_type:
  # Региональные турбовинтовые
  AT43: 90
  AT45: 90
  AT72: 90
  AT76: 90
  DH8D: 90

  # Региональные реактивные и ближнемагистральные
  E145: 95
  E170: 95
  E175: 95
  E190: 95
  E195: 95
  E75L: 95
  CRJ9: 95
  SU95: 95

# По классам, если тип не перечислен. Порог — максимальная взлётная масса.
by_class:
  - {max_mtow_t: 30,  kg: 90,  note: "регионалы"}
  - {max_mtow_t: 60,  kg: 95,  note: "ближнемагистральные"}
  - {max_mtow_t: 150, kg: 100, note: "среднемагистральные"}
  - {max_mtow_t: 999, kg: 100, note: "дальнемагистральные — ДОПУЩЕНИЕ: норма провоза багажа выше, вероятно занижено"}
