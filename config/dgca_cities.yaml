# Название города в статистике DGCA (Индия) -> аэропорт.
#
# DGCA публикует пары ГОРОДОВ, а не аэропортов, и пишет названия как
# придётся: «TIRUCHIRAPALLY» и «TIRUCHIRAPPALLI», «MUMBAI» до декабря 2025
# и «MUMBAI (MUMBAI)» / «MUMBAI (NAVI MUMBAI)» после. Перевод — здесь,
# в одном месте, и проверяется глазами, а не угадывается по сходству.
#
# Формы записи:
#   ИМЯ: ИАТА                         — однозначно
#   ИМЯ: {icao: VIDX}                 — у аэропорта нет кода ИАТА
#   ИМЯ: {iata: LHR, city: true}      — город с несколькими аэропортами,
#                                       поток отнесён к главному; так и
#                                       написано в подписи факта
#   ИМЯ: [{iata: GOI, until: "2022-12"}, {skip: "почему"}]
#                                     — смысл названия менялся во времени;
#                                       период «ГГГГ-ММ» включительно
#   ИМЯ: {skip: "почему"}             — не переводится, строка не берётся
#   scope: domestic | international   — правило только для этого файла
#
# Имени нет в списке — строки с ним не берутся и называются в сводке
# разбора: неизвестное не превращается в «потока нет» молча.
# Перечень — по названиям, действовавшим с 2023 года: хранятся последние
# 36 месяцев, старые имена не нужны.

