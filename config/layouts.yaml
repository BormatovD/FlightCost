# Компоновки салонов: кресел по типу ВС и перевозчику.
#
# Число кресел — не свойство типа, а решение перевозчика. У A320 бывает
# от 150 в трёхклассной компоновке до 186 у лоукостера, и разница в
# четверть напрямую входит в себестоимость кресла.
#
# openap даёт типовое значение (170 для A320) — оно используется, когда
# перевозчик не указан. Здесь ведутся конкретные компоновки, которые
# авиакомпании публикуют открыто.
#
# Ключ: <перевозчик>/<тип>. Перевозчик "*" — типовое значение, если
# нужно переопределить openap для всех.

layouts:
  # Сетевые: два класса, шаг кресел больше
  LH/A320: 168      # Lufthansa, европейская конфигурация
  LH/A321: 200
  LH/A20N: 180
  AF/A320: 174
  SU/A320: 158      # Аэрофлот, двухклассная
  SU/A321: 183

  # Лоукостеры: один класс, максимальная плотность
  FR/B738: 189      # Ryanair
  FR/B38M: 197      # Boeing 737 MAX 8-200 с дополнительной дверью
  W6/A21N: 239      # Wizz Air
  U2/A320: 186      # easyJet
  U2/A20N: 186

  # Дальнемагистральные
  LH/B77W: 340
  LH/A359: 293
