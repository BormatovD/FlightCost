<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlightCost — данные</title>
<link rel="stylesheet" href="/ui.css">
<style>
/* Просмотр хранилища (решение 219): домены слева, строки справа. Видно
   построчно только то, что разрешает лицензия источника; остальное — числом. */
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:600 17px var(--sans);color:var(--ink2)}
nav a{color:var(--dim);text-decoration:none;margin-right:14px;font-size:13px}
nav a.on,nav a:hover{color:var(--ink2)}
main{display:flex;min-height:calc(100vh - 54px)}
#doms{width:260px;flex:none;border-right:1px solid var(--line);padding:12px 0;overflow-y:auto}
.dom{padding:8px 18px;cursor:pointer;border-left:3px solid transparent}
.dom:hover{background:var(--raise)}
.dom.on{background:var(--select);border-left-color:var(--ink2)}
.dom b{display:block;font-weight:600;color:var(--ink2);font-size:13.5px}
.dom span{font-size:11.5px;color:var(--dim)}
#body{flex:1;padding:18px 24px 60px;min-width:0}
#body h2{margin:0 0 4px;font-size:19px;color:var(--ink2)}
.lead{color:var(--dim);font-size:13px;max-width:80ch}
.srcs{margin:10px 0 14px;font-size:12px;color:var(--dim)}
.srcs div{margin:2px 0}
.lock{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:6px 9px;font:13px var(--sans);width:260px}
.bar .cnt{color:var(--dim);font-size:12.5px}
.pager button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:4px 10px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--dim);font-size:11.5px;letter-spacing:.04em;
  padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.m{font:12px var(--mono);color:var(--dim)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--raise)}
.props{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--dim)}
.props b{color:var(--ink);font-weight:500}
#detail{margin-top:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.closed{margin-top:12px;font-size:12.5px;color:var(--dim)}
.intro{max-width:72ch;color:var(--dim)}
@media(max-width:820px){main{flex-direction:column}#doms{width:auto;border-right:0;border-bottom:1px solid var(--line);
  display:flex;overflow-x:auto;padding:0}.dom{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .dom.on{border-bottom-color:var(--ink2)}.dom span{display:none}#body{padding:14px 16px 50px}.bar input{width:100%}}
</style></head><body>
<header><h1>FlightCost</h1>
<nav><a href="/">Расчёт</a><a href="/map">Карта данных</a><a href="/data" class="on">Данные</a></nav></header>
<main><div id="doms"></div><div id="body"><div class="intro" id="intro"></div></div></main>
<script type="module">
const I18N = /*I18N*/{}/*/I18N*/;
const LANGS = ["ru", "en", "de"];
const LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) { try { localStorage.setItem("fca.lang", q); } catch (e) {} return q; }
  let saved = null;
  try { saved = localStorage.getItem("fca.lang"); } catch (e) {}
  if (LANGS.includes(saved)) return saved;
  for (const l of (navigator.languages || [navigator.language || ""])) {
    const p = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(p)) return p;
  }
  return "en";
})();
const LOCALE = {ru: "ru-RU", en: "en-GB", de: "de-DE"}[LANG];
function _t(s) {
  if (LANG === "ru") return s;
  const v = (I18N[LANG] || {})[String(s).replace(/\s+/g, " ").trim()];
  return v == null ? s : v;
}
document.documentElement.lang = LANG;
document.querySelectorAll("nav a, header h1").forEach(a => a.textContent = _t(a.textContent));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = (v, d = 0) => v == null ? "—" : Number(v).toLocaleString(LOCALE, {maximumFractionDigits: d});
// Названия разделов — здесь, чтобы их видел каталог переводов.
const DT = {
  aircraft: [_t("Типы ВС"), _t("Паспорт типа: массы, крейсер, двигатели, кресла — из openap, EASA и своих типов")],
  airport: [_t("Аэропорты"), _t("Координаты и коды ИКАО/ИАТА — OurAirports")],
  airport_limits: [_t("Полосы аэропортов"), _t("Длина, ширина и покрытие ВПП — OurAirports")],
  traffic: [_t("Поток по парам"), _t("Пассажиры, перевезённые между аэропортами: Eurostat, BTS T-100, DGCA")],
  airport_charge: [_t("Сборы аэропортов"), _t("Ставки сборов по аэропортам и статьям")],
  enroute_rate: [_t("Аэронавигация: ставки зон"), _t("Ставка за единицу обслуживания по государствам")],
  terminal_rate: [_t("Аэронавигация: терминальные"), _t("Ставки терминальных зон")],
  jet_fuel_price: [_t("Цена топлива"), _t("Котировки авиакеросина")],
  fx: [_t("Курсы валют"), _t("Курсы к евро: ЕЦБ, Банк России, CRCO")],
  carrier_benchmark: [_t("Отчётность перевозчиков"), _t("Величины из годовых отчётов: выручка, расходы, блок-часы")],
  fleet_benchmark: [_t("Экономика флота"), _t("Form 41 США и IATA/EUROCONTROL ACMG")],
  city: [_t("Города"), _t("Население городов от 15 тыс. — GeoNames, для модели потока")],
  market_fare: [_t("Цены билетов"), _t("Медианы дневных минимумов агрегатора")],
  observed: [_t("Наблюдённые рейсы"), _t("ADS-B OpenSky: сводки по парам и типам")]
};
const dtitle = (d, f) => (DT[d] || [f])[0], dnote = (d, f) => (DT[d] || [, f])[1];
const S = {dom: null, q: "", page: 0, cat: null};

$("#intro").innerHTML = `<h2>${_t("Что лежит в базе")}</h2><p>${_t("Всё, из чего складывается расчёт: типы самолётов, аэропорты, сборы, поток по парам, курсы. Слева — разделы, в каждом — откуда данные и насколько свежие. Построчно показано то, что разрешает лицензия источника; остальное — только числом записей.")}</p>`;

async function loadCat(){
  S.cat = await (await fetch("/api/browse")).json();
  $("#doms").innerHTML = S.cat.domains.map(d => `<div class="dom" data-d="${esc(d.domain)}"><b>${esc(dtitle(d.domain, d.title))}</b>
    <span>${num(d.open)} ${_t("записей")}${d.closed ? ` · ${num(d.closed)} ${_t("закрыто лицензией")}` : ""}</span></div>`).join("");
  document.querySelectorAll(".dom").forEach(el => el.onclick = () => pick(el.dataset.d));
  // Со страницы карты приходит адрес записи: раздел и ключ.
  const P = new URLSearchParams(location.search), want = P.get("domain"), key = P.get("key");
  if (want) pick(want, key || "").then(() => { if (key) detail(key); });
}

function pick(d, q = ""){
  S.dom = d; S.page = 0; S.q = q;
  document.querySelectorAll(".dom").forEach(el => el.classList.toggle("on", el.dataset.d === d));
  const u = new URL(location.href); u.searchParams.set("domain", d);
  if (!q) u.searchParams.delete("key");
  history.replaceState(null, "", u);
  return load();
}

async function load(){
  const r = await (await fetch(`/api/browse?domain=${encodeURIComponent(S.dom)}&q=${encodeURIComponent(S.q)}&page=${S.page}`)).json();
  const meta = S.cat.domains.find(x => x.domain === S.dom) || {sources: {}};
  const srcs = Object.entries(meta.sources || {}).map(([k, s]) => `<div>${s.public ? "" : `<span class="lock">${_t("закрыто")}:</span> `}<b>${esc(s.title)}</b> — ${num(s.n)} ${_t("записей")}${s.license ? ` · ${_t("лицензия")}: ${esc(s.license)}` : ""}${
    /^https?:\/\//.test(s.url || "") ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">${_t("источник")}</a>` : ""}</div>`).join("");
  $("#body").innerHTML = `<h2>${esc(dtitle(S.dom, r.title))}</h2><div class="lead">${esc(dnote(S.dom, meta.note || ""))}</div>
    <div class="srcs">${srcs}</div>
    <div class="bar"><input id="q" placeholder="${_t("поиск: код, название, пара")}" value="${esc(S.q)}">
      <span class="cnt">${num(r.total)} ${_t("строк")}${r.pages > 1 ? ` · ${_t("стр.")} ${r.page + 1} / ${r.pages}` : ""}</span>
      <span class="pager"><button id="prev" ${r.page <= 0 ? "disabled" : ""}>←</button> <button id="next" ${r.page + 1 >= r.pages ? "disabled" : ""}>→</button></span></div>
    <div class="tw">${table(r)}</div>
    ${r.closed ? `<div class="closed">${num(r.closed)} ${_t("записей этого раздела не показываются построчно: лицензия источника не разрешает их публиковать. В расчётах на сайте они участвуют.")}</div>` : ""}
    <div id="detail"></div>`;
  const qi = $("#q"); let tm;
  qi.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.q = qi.value; S.page = 0; load().then(() => { const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); }, 300); };
  $("#prev").onclick = () => { S.page--; load(); };
  $("#next").onclick = () => { S.page++; load(); };
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => detail(tr.dataset.k));
}

// Строки — по-своему у главных разделов, остальное — общей таблицей.
function table(r){
  if (!r.rows.length) return `<div class="card">${_t("Ничего не найдено.")}</div>`;
  if (r.kind === "aircraft") {
    const pick = ["name", "mtow_t", "mtow", "oew_t", "seats", "max_seats", "cruise_mach", "range_km", "engine"];
    return `<table><thead><tr><th>${_t("Тип")}</th><th>${_t("Свойства")}</th><th>${_t("Источник")}</th></tr></thead><tbody>${
      r.rows.map(x => `<tr class="row" data-k="${esc(x.key)}"><td><b>${esc(x.key)}</b></td><td><div class="props">${
        Object.entries(x.props).sort((a, b) => (pick.indexOf(a[0]) + 1 || 99) - (pick.indexOf(b[0]) + 1 || 99)).slice(0, 8)
          .map(([k, v]) => `<span>${esc(k)} <b>${v.value != null ? num(v.value, 2) : esc(v.text)}</b> ${esc(v.unit || "")}</span>`).join("")
      }</div></td><td class="m">${esc(x.sources.join(", "))}</td></tr>`).join("")}</tbody></table>`;
  }
  if (r.kind === "airport") return rowsTable(r, [_t("ИАТА"), _t("ИКАО"), _t("Страна"), _t("Название"), _t("Координаты")],
    x => { const [ll, icao, cc, name] = (x.text || "").split("|"); return [`<b>${esc(x.key)}</b>`, esc(icao), esc(cc), esc(name), `<span class="m">${esc(ll)}</span>`]; });
  if (r.kind === "city") return rowsTable(r, [_t("Город"), _t("Страна"), _t("Жителей")],
    x => { const [, cc, name] = (x.text || "").split("|"); return [esc(name), esc(cc), num(x.value)]; }, [2]);
  if (r.kind === "traffic") return rowsTable(r, [_t("Пара"), _t("Год"), _t("Пассажиров за год"), _t("Источник")],
    x => { const [rep, pair, y] = x.key.split("/"); return [`<b>${esc(pair)}</b>`, esc(y), num(x.value), esc(x.source_title)]; }, [2]);
  return rowsTable(r, [_t("Ключ"), _t("Значение"), _t("Пояснение"), _t("С даты"), _t("Источник")],
    x => [`<b>${esc(x.key)}</b>`, x.value != null ? `${num(x.value, 4)} ${esc(x.unit || "")}${x.currency && x.currency !== x.unit ? " " + esc(x.currency) : ""}` : esc(x.unit || ""),
          `<span class="m">${esc((x.text || "").slice(0, 140))}</span>`, esc(x.from), esc(x.source_title)], [1]);
}
function rowsTable(r, heads, cells, right = []){
  return `<table><thead><tr>${heads.map((h, i) => `<th${right.includes(i) ? ' style="text-align:right"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${
    r.rows.map(x => `<tr class="row" data-k="${esc(x.key)}">${cells(x).map((c, i) => `<td${right.includes(i) ? ' class="r"' : ""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

async function detail(key){
  if (S.dom === "aircraft") {
    key = key.split("/")[0];          // адрес свойства `A320/mtow_t` → тип
    const r = await (await fetch(`/api/browse?domain=aircraft&q=${encodeURIComponent(key)}`)).json();
    const x = r.rows.find(y => y.key === key);
    if (!x) return;
    $("#detail").innerHTML = `<div class="card"><h3 style="margin:0 0 8px">${esc(key)}</h3><table>${
      Object.entries(x.props).map(([k, v]) => `<tr><td class="m">${esc(k)}</td><td class="r">${v.value != null ? num(v.value, 4) : esc(v.text)}</td><td class="m">${esc(v.unit || "")}</td></tr>`).join("")}</table></div>`;
    $("#detail").scrollIntoView({behavior: "smooth", block: "nearest"});
    return;
  }
  const r = await (await fetch(`/api/fact?domain=${encodeURIComponent(S.dom)}&key=${encodeURIComponent(key)}`)).json();
  // Ключ без записи раскрывается в правила под префиксом (сборы по статьям).
  const recs = r.kind === "prefix" ? r.rules : [r.current, ...(r.history || [])].filter(Boolean);
  const src = r.source || {};
  const line = x => `<tr><td class="m">${esc(x.key || key)}</td><td class="r">${x.value != null ? num(x.value, 4) : esc((x.value_text || "").slice(0, 120))}</td>
    <td class="m">${esc(x.unit || "")}${x.currency && x.currency !== x.unit ? " " + esc(x.currency) : ""}</td>
    <td class="m">${esc(x.valid_from || "")}${x.valid_to ? " → " + esc(x.valid_to) : ""}</td><td class="m">${esc(x.confidence || "")}</td></tr>`;
  $("#detail").innerHTML = `<div class="card"><h3 style="margin:0 0 6px">${esc(key)}</h3>
    <div class="lead">${_t("Запись и её история: значение, с какой даты действует, откуда и насколько надёжно.")}</div>
    ${r.restricted ? `<div class="lead lock">${_t("Источник не разрешает публиковать записи построчно — показано только действующее значение.")}</div>` : ""}
    <div class="srcs">${_t("Источник")}: <b>${esc(src.title || src.id || "")}</b>${src.license ? ` · ${_t("лицензия")}: ${esc(src.license)}` : ""}${src.url ? ` · <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.url)}</a>` : ""}</div>
    <div class="tw"><table><thead><tr><th>${_t("Ключ")}</th><th style="text-align:right">${_t("Значение")}</th><th>${_t("Ед.")}</th><th>${_t("Действует")}</th><th>${_t("Происхождение")}</th></tr></thead>
    <tbody>${recs.map(line).join("")}</tbody></table></div></div>`;
  $("#detail").scrollIntoView({behavior: "smooth", block: "nearest"});
}
loadCat();
</script></body></html>
