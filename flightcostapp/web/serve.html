// CASK считается на КРЕСЛАХ ответа, а не на константе: 170 в двух местах
// давали E195 экономику A320 (решение 44).
function cask(r){
  return r.answer.cost_total / (r.route.seats * r.route.distance_nm * 1.852) * 100;
}

// Полоса перевозчиков грузится один раз на пару аэропортов и служит и
// показателям над глобусом, и вкладке «Маршрут».
let BENCH = null, BENCH_KEY = "";
async function loadBench(){
  const key = CHOSEN.o + "|" + CHOSEN.d;
  if (BENCH && BENCH_KEY === key) return BENCH;
  const b = await (await fetch(`/api/bench?origin=${
    encodeURIComponent(CHOSEN.o)}&destination=${
    encodeURIComponent(CHOSEN.d)}`)).json();
  BENCH = b; BENCH_KEY = key;
  return b;
}

// Перевозчик, с которым сравниваем. Один, а не множество: сравнение —
// это два числа рядом, и рядом с нашим стоит ровно одно чужое. Выбор
// переживает смену маршрута: список перевозчиков приходит заново,
// выбор — нет.
let KPI_CARRIER = null;

function kpiCell(k, n, sub, bad, cmpId){
  return `<div><div class="k">${k}</div><div class="n${bad ? " bad" : ""}">${n}</div>
    <div class="s" title="${esc(sub)}">${esc(sub)}</div>${
    cmpId ? `<div class="s cmp" id="${cmpId}"></div>` : ""}</div>`;
}

function drawKpi(r){
  const a = r.answer, fare = +$("#fare").value || 0, be = a.breakeven_fare_eur;
  const why = whyNot(a);
  // Нет поля — поломка, а не пустота (решение 77): показывается оранжевым,
  // а не пропадает в NaN.
  const seatsOk = Number.isFinite(r.route.seats) && r.route.seats > 0;
  const cells = [];
  // «Нельзя» — ответ, а не отсутствие ответа (решение 93): стоит там же,
  // где стояло бы число.
  cells.push(kpiCell(_t("Стоимость рейса"),
    a.feasible ? f0(a.cost_total) + `<small>EUR</small>` : _t("нельзя"),
    !a.feasible ? why
      : seatsOk ? `${f0(a.cost_total / Math.max(1, r.route.pax))} ${_t("EUR на пассажира")}`
      : _t("в ответе нет кресел — перезапусти fca serve"),
    !a.feasible || !seatsOk));
  cells.push(kpiCell(_t("Безубыточный чек"),
    a.feasible ? f0(be) + `<small>EUR</small>` : "—",
    !a.feasible ? "" : !fare ? _t("чек не задан")
      : be <= fare ? `${_t("задан")} ${f0(fare)} — ${_t("запас")} ${f0(fare - be)} ${_t("EUR с пассажира")}`
      : `${_t("задан")} ${f0(fare)} — ${_t("не хватает")} ${f0(be - fare)} ${_t("EUR с пассажира")}`,
    a.feasible && fare > 0 && be > fare, "kpi-yield"));
  cells.push(kpiCell("CASK",
    !a.feasible ? "—" : seatsOk ? f2(cask(r)) + `<small>${_t("ц / кресло-км")}</small>`
      : _t("нет кресел"),
    seatsOk ? `${r.route.seats} ${_t("кресел · плечо")} ${f0(r.route.distance_nm)} nm`
            : _t("в ответе нет поля seats"),
    a.feasible && !seatsOk, "kpi-cask"));
  $("#kpi").innerHTML = cells.join("") + `<div><div class="k">${_t("Сравнить с")}</div>
    <div id="kpichips"><span class="s">${_t("считаю…")}</span></div>
    <div class="s" id="kpisub"></div></div>`;
  loadBench().then(b => { if (LAST === r) drawChips(b); });
}

function drawChips(b){
  const box = $("#kpichips"), sub = $("#kpisub");
  if (!box) return;
  const cs = (b.carriers || []).filter(c => c.cask_cents || c.yield_eur_pax);
  if (!cs.length) {
    box.innerHTML = `<span class="s">${_t("полосы нет — отчётность не заведена")}</span>`;
    sub.textContent = ""; $("#kpi-yield").textContent = ""; $("#kpi-cask").textContent = "";
    return;
  }
  // Выбор — код перевозчика и год, два поля. Название ищется по
  // подстроке, как аэропорт: «люфт» находит Lufthansa, «аэро» — Аэрофлот.
  if (!cs.some(c => c.carrier === KPI_CARRIER)) KPI_CARRIER = cs[0].carrier;
  const cur = cs.find(c => c.carrier === KPI_CARRIER);
  const years = cs.filter(c => c.code === cur.code).map(c => c.year);
  box.className = "cpick";
  box.innerHTML = `<input id="cq" autocomplete="off" value="${esc(cur.name)}" title="${_t("перевозчик")}">
    <div class="hits" id="cqh"></div>
    <select id="cy" title="${_t("год отчётности")}">${[...new Set(years)].map(y =>
      `<option${y === cur.year ? " selected" : ""}>${esc(y)}</option>`).join("")}</select>`;
  const inp = $("#cq"), hits = $("#cqh");
  const rows = q => {
    const t = q.trim().toLowerCase();
    // Один контур на перевозчика в списке: год выбирается рядом.
    const seen = new Set();
    return cs.filter(c => (!t || (c.name + " " + c.code).toLowerCase().includes(t))
                          && !seen.has(c.code) && seen.add(c.code));
  };
  const show = () => {
    hits.innerHTML = rows(inp.value).map(c => `<div class="hit" data-c="${esc(c.carrier)}">
      <b>${esc(c.code)}</b>${esc(c.name)}<i>${esc(c.scope.slice(0, 70))}</i></div>`).join("")
      || `<div class="hit" style="color:var(--dim)">${_t("ничего не нашлось")}</div>`;
    hits.classList.add("on");
    hits.querySelectorAll(".hit[data-c]").forEach(el =>
      el.addEventListener("mousedown", e => { e.preventDefault();
        KPI_CARRIER = el.dataset.c; drawChips(b); }));
  };
  inp.addEventListener("focus", () => { inp.select(); show(); });
  inp.addEventListener("input", show);
  inp.addEventListener("blur", () => setTimeout(() => {
    hits.classList.remove("on"); inp.value = cur.name; }, 140));
  $("#cy").onchange = e => {
    KPI_CARRIER = `${cur.code}/${e.target.value}`; drawChips(b);
  };
  // Вердикта нет (решение 95): рядом с нашим числом стоит чужое и плечо,
  // на котором оно получено. Это всё, что здесь можно сказать честно.
  // Без названия перевозчика: оно стоит в поле выбора справа, а строка
  // сравнения — про число и плечо, на котором оно получено.
  // Белым и жирным — только число; слово «бенчмарк» и единицы серым.
  const bm = (num, unit, sub) => `${_t("бенчмарк")}: ${num ? `<b>${esc(num)}</b> ` : ""}${
    esc(unit)}<br>${esc(sub)}`;
  // Рублёвый CASK, пересчитанный по курсу, — сравнение уровня цен, а не
  // эффективности: валюта отчёта называется рядом с плечом.
  const zone = cur.fx && cur.fx.currency && cur.fx.currency !== "EUR"
    ? ` · ${_t("отчёт в")} ${cur.fx.currency}, ${_t("другая валютная зона")}` : "";
  $("#kpi-cask").innerHTML = cur.cask_cents
    ? bm(f2(cur.cask_cents), _t("ц"), `${_t("на плече")} ${f0(cur.sector_nm)} nm${zone}`)
    : bm("", _t("не считается"), cur.fx && !cur.fx.rate ? (_t("нет курса") + " ") + cur.fx.currency : "");
  $("#kpi-yield").innerHTML = (cur.yield_eur_pax
    ? bm(f0(cur.yield_eur_pax), _t("EUR с пассажира"), cur.yield_basis || "")
    : bm("", _t("не публикует"), _t("доход с пассажира в отчёте не назван")))
    + marketLine(b);
  sub.textContent = _t("другое плечо и сеть — прямо сравнивать нельзя");
}

// Видимая цена на линии — медиана МИНИМУМОВ по датам вылета из выгрузок
// агрегатора, по полосам глубины бронирования. Это не средний чек
// (решение 8): минимум дешёвого класса с налогами внутри. Показывается
// рядом с безубыточным чеком как «можно ли войти ценой», без вердикта.
function marketLine(b){
  const fares = b.fare || [];
  if (!fares.length) {
    return `<br><span class="s">${_t("рынок")}: ${b.fare_elsewhere
      ? `${_t("по этой линии наблюдений нет (есть по")} ${b.fare_elsewhere} ${_t("другим)")}`
      : _t("наблюдений цены нет")}</span>`;
  }
  const vals = b.fare_eur || fares.map(x => x.value);
  const unit = b.fare_eur ? "EUR" : (fares[0].unit || "?");
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const band = fares.length === 1 ? esc(fares[0].key.split("/")[1] || "")
    : `${fares.length} ${_t("полос глубины")}`;
  return `<br>${_t("рынок")}: <b>${f0(lo)}${hi > lo ? "–" + f0(hi) : ""}</b> ${esc(unit)} · ${band}`
    + `<br><span class="s">${_t("минимум дешёвого класса, налоги внутри — не средний чек · по данным Aviasales")}</span>`;
}

function carrierCard(c){
  const cask = c.cask_cents ? f2(c.cask_cents) + (" " + _t("ц"))
    : c.fx && !c.fx.rate
      ? `<span style="color:var(--warn)">${_t("нет курса")} ${esc(c.fx.currency)}</span>` : "—";
  return `<div class="carrier"><div class="ch">${esc(c.name)} · ${esc(c.year)}
      <span style="color:var(--faint);font-weight:400">${esc(c.code)}</span></div>
    <div class="cs">${esc((c.scope||"").trim())}</div>
    <div class="kv">
      <span>CASK</span><b>${cask}</b>
      <span>${_t("доход с пассажира")}</span><b>${c.yield_eur_pax ? f0(c.yield_eur_pax) + " EUR" : "—"}
        ${c.yield_basis ? `<i>${esc(c.yield_basis)}</i>` : ""}</b>
      <span>${_t("среднее плечо")}</span><b>${c.sector_nm ? f0(c.sector_nm) + " nm" : "—"}</b>
      <span>${_t("стоимость блок-часа")}</span><b>${c.cost_per_block_h
        ? f0(c.cost_per_block_h) + (" " + _t("EUR/ч"))
        : `<span style="color:var(--faint)">${_t("не публикует")}</span>`}</b>
      <span>${_t("затраты на пассажира")}</span><b>${c.cost_per_pax ? f0(c.cost_per_pax) + " EUR" : "—"}</b>
    </div></div>`;
}

async function drawBench(r){
  const b = await loadBench();
  if (LAST !== r || !$("#benchbox")) return;      // ответ обогнал более свежий
  const our = {cask: cask(r),
               sector: r.route.distance_nm, be: r.answer.breakeven_fare_eur};
  const box = [];

  if ((b.carriers || []).length) {
    box.push(b.carriers.map(carrierCard).join(""));
    // ВЕРДИКТА НЕТ, и это решение 95: полоса собрана на другом плече.
    // На коротком секторе постоянные статьи делятся на меньшее число
    // кресло-километров, и CASK выше при той же эффективности. Сравнивать
    // напрямую нельзя, а показывать оба числа с названным плечом — можно.
    const noFx = b.carriers.filter(c => c.fx && !c.fx.rate);
    if (noFx.length) box.push(`<div class="note"><b>${_t("Пересчёт невозможен.")}</b>
      ${noFx.map(c => esc(c.carrier) + " — " + esc(c.fx.currency)).join(", ")}:
      ${_t("курса в справочнике нет, и подставлять правдоподобный нельзя — получилась бы полоса, собранная из чисел в разных деньгах. Это открытый вопрос карты: источники курса вне котировок ЕЦБ.")}</div>`);
    const c0 = b.carriers.find(c => c.cask_cents);
    if (c0) box.push(`<div class="note"><b>${_t("Прямо сравнивать нельзя.")}</b>
      ${_t("Наш маршрут")} — ${f0(our.sector)} ${_t("nm, полоса собрана на среднем плече")}
      ${f0(c0.sector_nm)} ${_t("nm. На коротком секторе постоянные статьи рейса делятся на меньшее число кресло-километров, и CASK выше при той же эффективности. Наши")} ${f2(our.cask)} ${_t("ц против")}
      ${f2(c0.cask_cents)} ${_t("ц — разница, в которой доля плеча пока не отделена от доли параметрики.")}</div>`);
  } else {
    box.push(`<div class="note"><b>${_t("Полосы нет.")}</b> ${_t("Отчётность перевозчиков не заведена: сравнивать себестоимость не с чем.")}</div>`);
  }

  box.push(`<table class="wrap" style="margin-top:12px"><tbody>`);
  box.push(b.yield
    ? `<tr><td>${_t("Доход с пассажира")}<div style="color:var(--faint);font-size:11px">
         ${_t("сходится ли экономика линии")}</div></td>
       <td class="v">${f0(b.yield.lo)} – ${f0(b.yield.hi)} EUR</td>
       <td style="color:var(--faint);font-size:11px">${b.yield.n} ${b.yield.n > 1 ? _t("контура") : _t("контур")}</td></tr>`
    : `<tr><td>${_t("Доход с пассажира")}</td><td class="v" style="color:var(--warn)">${_t("нет данных")}</td><td></td></tr>`);
  box.push((b.fare || []).length
    ? `<tr><td>${_t("Видимая цена на линии")}<div style="color:var(--faint);font-size:11px">
         ${_t("можно ли войти ценой · медиана МИНИМУМОВ по датам")}</div></td>
       <td class="v">${b.fare_eur
         ? b.fare_eur.map(f0).join(" / ") + ' <span style="color:var(--dim);font-size:11px">EUR</span>'
         : b.fare.map(x => f0(x.value)).join(" / ")
           + ` <span style="color:var(--warn);font-size:11px">${
               esc([...new Set(b.fare.map(x => x.unit))].join("/") || "?")
             }</span>`}</td>
       <td style="color:var(--faint);font-size:11px">${b.fare.length} ${_t("полос глубины · по данным Aviasales")}${b.fare_eur
         ? `<br>${esc(b.fare_src_cur)} ${_t("по курсу")} ${esc(b.fare_fx)}`
         : `<br><span style="color:var(--warn)">${_t("курса нет, показано как есть")}</span>`}</td></tr>`
    : `<tr><td>${_t("Видимая цена на линии")}<div style="color:var(--faint);font-size:11px">
         ${_t("можно ли войти ценой")}</div></td>
       <td class="v" style="color:var(--warn)">${_t("нет данных")}</td>
       <td style="color:var(--faint);font-size:11px">${b.fare_elsewhere
         ? `${_t("по этому маршруту нет; полосы есть по")} ${b.fare_elsewhere} ${_t("другим")}`
         : _t("наблюдений нет вовсе")}</td></tr>`);
  box.push(`</tbody></table>`);
  $("#benchbox").innerHTML = box.join("");
}

// Шторка закрывается по крестику и по Esc. Клик мимо не закрывает:
// под шторкой глобус, и промах по нему вращал бы карту, теряя пояснение.
function closeSheet(){ $("#sheet").classList.remove("on"); }
window.closeSheet = closeSheet;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
});

async function side(d){
  $("#sheet").classList.add("on");
  // Адрес приходит полем `ref` вида «домен/ключ». Разбираем ПО ПЕРВОМУ
  // слэшу: в ключе слэши есть и они значимы — `EDDF/passenger`,
  // `spot/USGC`, `A320/mtow_t`. Прежде здесь разбиралось поле `src`, а
  // оно проза для человека, не адрес.
  const ref = (d.ref || "").trim();
  const cut = ref.indexOf("/");
  const [domain, key] = cut > 0 ? [ref.slice(0, cut), ref.slice(cut + 1)] : ["", ""];
  let h = `<span class="close" onclick="closeSheet()">×</span><h3 style="margin-top:0">${esc(d.label)}</h3>`;
  if (!domain || !key) {
    // Прежде здесь стояло «шаг не стоит на факте» — фраза точная и
    // непонятная. Величина расчётная, и продолжать трассировку надо не
    // объяснением, чего нет, а перечнем того, из чего она получена.
    // Карта данных это знает: у узла перечислены входы.
    h += `<p class="lede">${_t("Расчётное значение: получено из других величин, а не взято из справочника.")}</p>
      <dl class="kv">
        <dt>${_t("формула")}</dt><dd style="font-family:var(--mono)">${
          esc(d.formula || "—")}</dd>
        <dt>${_t("подстановка")}</dt><dd style="font-family:var(--mono)">${
          esc(d.subst || "—")}</dd>
        ${d.src ? `<dt>${_t("пояснение")}</dt><dd style="font-family:inherit">${
          esc(d.src)}</dd>` : ""}
      </dl><div id="nodebox"></div>`;
    $("#side").innerHTML = h;
    if (d.node) {
      const nd = await (await fetch(`/api/node?id=${encodeURIComponent(d.node)}`)).json();
      $("#nodebox").innerHTML = nd.found
        ? `<h3>${_t("Откуда берутся входы")}</h3>` + (nd.inputs.length
            ? `<table class="wrap"><tbody>` + nd.inputs.map(i => `<tr>
                 <td>${esc(i.label)}<div style="color:var(--faint);font-size:11px">${
                   esc(i.take)}</div>${(i.sources || []).map(s => `
                   <div style="font-size:11.5px;margin-top:3px">${esc(s.title || s.id)}${
                     s.url ? s.templated
                       ? ` · <span style="color:var(--faint)">${_t("шаблон адреса")}: ${esc(s.url)}</span>`
                       : ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">${_t("источник")}</a>`
                     : ""}</div>`).join("")}</td>
                 <td style="color:var(--dim);font-size:12px">${esc(i.unit)}</td>
                 <td><span class="chip">${esc(i.role)}</span></td></tr>`).join("")
              + `</tbody></table>`
            : `<div class="note quiet"><b>${_t("Входов на карте нет.")}</b> ${_t("Узел")}
                <span class="num">${esc(d.node)}</span> — ${_t("начало цепочки: вход пользователя или внешний источник.")}</div>`)
          + (nd.note ? `<p class="lede" style="margin-top:10px">${esc(nd.note)}</p>` : "")
          // Справочники за цепочкой входов — с адресом, который можно
          // открыть. Шаблонный адрес (помесячные файлы CRCO) показывается
          // как шаблон: подставлять месяц за пользователя — выдумывать.
          + ((nd.sources || []).length ? `<h3>${_t("Источники")}</h3><dl class="kv">` +
              nd.sources.map(s => `<dt>${esc(s.domain)}</dt><dd style="font-family:inherit">${
                esc(s.title || s.id)}${s.url ? s.templated
                  ? `<div style="color:var(--faint);font-size:11.5px">${_t("шаблон адреса")}: ${esc(s.url)}</div>`
                  : `<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>`
                : ""}${s.license ? `<div style="color:var(--faint);font-size:11.5px">${_t("лицензия")} ${
                  esc(s.license)}</div>` : ""}</dd>`).join("") + `</dl>` : "")
        : `<div class="note"><b>${_t("Узла нет на карте.")}</b> ${esc(nd.why || "")}</div>`;
    }
    return;
  }
  const r = await (await fetch(`/api/fact?domain=${encodeURIComponent(domain)
    }&key=${encodeURIComponent(key)}`)).json();
  if (!r.found) { h += `<div class="note"><b>${_t("Ключа нет.")}</b> ${esc(r.why)}</div>`;
    $("#side").innerHTML = h; return; }
  if (r.kind === "prefix") {
    // Статья складывается из нескольких правил: у Франкфурта
    // пассажирский сбор — четыре строки по направлениям. Показываем все,
    // потому что спорят обычно не с одной строкой, а с трактовкой статьи.
    h += `<p class="lede">${_t("Статья складывается из")} ${r.count} ${_t("правил. Каждое — отдельный факт со своим происхождением.")}</p>
      <table><tbody>` + r.rules.map(x => {
        let w = "";
        try { const j = JSON.parse(x.value_text || "{}");
              w = Object.entries(j.when || {}).map(([k,v])=>`${k}=${v}`).join(" "); }
        catch (e) {}
        return `<tr><td>${esc(w || _t("без условий"))}<div style="color:var(--faint);
            font-size:11px">${esc(x.clause || x.source_note || "")}</div></td>
          <td class="v">${x.value ?? "—"}</td>
          <td style="font-size:11px;color:${x.certainty && x.certainty!=="exact"
            ? "var(--warn)" : "var(--faint)"}">${esc(x.certainty||"")}</td></tr>`;
      }).join("") + `</tbody></table>`;
    // Сначала документ — тариф, который можно открыть. Реестр ниже: он
    // называет папку, а не тариф, и без документа правило выглядело
    // взявшимся ниоткуда.
    const doc = r.document || {};
    h += `<h3>${_t("Документ")}</h3><dl class="kv">
      ${doc.url ? `<dt>${_t("тариф")}</dt><dd style="font-family:inherit">${
          esc(doc.title || _t("название не сохранено в факте — нужен --reparse"))}</dd>
        <dt>${_t("адрес")}</dt><dd><a href="${esc(doc.url)}" target="_blank" rel="noopener">${
          esc(doc.url)}</a></dd>`
        : `<dt>${_t("тариф")}</dt><dd style="color:var(--warn);font-family:inherit">${_t("адрес публикации в факте не сохранён")}</dd>`}
    </dl>
    <h3>${_t("Источник в реестре")}</h3><dl class="kv">
      <dt>${_t("реестр")}</dt><dd>${esc(r.source.id)}</dd>
      <dt>${_t("название")}</dt><dd style="font-family:inherit">${esc(r.source.title||"—")}</dd>
      ${r.source.url?`<dt>${_t("адрес")}</dt><dd><a href="${esc(r.source.url)}"
        target="_blank" rel="noopener">${esc(String(r.source.url).slice(0,60))}…</a></dd>`:""}
      <dt>${_t("лицензия")}</dt><dd style="font-family:inherit">${esc(r.source.license||"—")}</dd>
    </dl>`;
    $("#side").innerHTML = h; return;
  }
  const c = r.current;
  h += `<dl class="kv">
    <dt>${_t("домен")}</dt><dd>${esc(r.domain)}</dd>
    <dt>${_t("ключ")}</dt><dd>${esc(r.key)}</dd>
    <dt>${_t("значение")}</dt><dd>${c.value ?? "—"} ${esc(c.unit||"")} ${esc(c.currency||"")}</dd>
    <dt>${_t("действует с")}</dt><dd>${esc(c.valid_from)}${c.valid_to?` ${_t("по")} ${esc(c.valid_to)}`:""}</dd>
    <dt>${_t("происхождение")}</dt><dd>${esc(c.confidence)}</dd>
    <dt>${_t("прочтение")}</dt><dd>${esc(c.certainty)}</dd>
    ${c.error_cost?`<dt>${_t("цена ошибки")}</dt><dd>${c.error_cost}</dd>`:""}
    ${c.confirm_by?`<dt>${_t("закроет вопрос")}</dt><dd>${esc(c.confirm_by)}</dd>`:""}
  </dl>`;
  if (c.source_note) h += `<div class="note quiet">${esc(c.source_note)}</div>`;
  h += `<h3>${_t("Источник")}</h3><dl class="kv">
    <dt>${_t("реестр")}</dt><dd>${esc(r.source.id)}</dd>
    <dt>${_t("название")}</dt><dd style="font-family:inherit">${esc(r.source.title||"—")}</dd>
    ${r.source.url?`<dt>${_t("адрес")}</dt><dd><a href="${esc(r.source.url)}"
      target="_blank" rel="noopener">${esc(String(r.source.url).slice(0,60))}…</a></dd>`:""}
    <dt>${_t("лицензия")}</dt><dd style="font-family:inherit">${esc(r.source.license||"—")}</dd>
    <dt>${_t("ритм")}</dt><dd>${_t("каждые")} ${r.source.cadence_days} ${_t("дн., SLA")} ${r.source.sla_days}</dd>
  </dl>`;
  if (r.history.length) {
    h += `<h3>${_t("История редакций")} — ${r.history.length}</h3><table><tbody>` +
      r.history.slice(0,20).map(x => `<tr><td class="num">${esc(x.valid_from)}</td>
        <td class="v">${x.value ?? "—"}</td>
        <td style="color:var(--faint);font-size:11.5px">${esc(x.certainty)}</td></tr>`)
      .join("") + `</tbody></table>`;
  } else {
    h += `<div class="note quiet"><b>${_t("Прежних редакций нет.")}</b> ${_t("Значение заведено один раз и с тех пор не менялось.")}</div>`;
  }
  $("#side").innerHTML = h;
}

// Поля выбора аэропорта НЕ вешаются на общий обработчик: у них свой,
// и пересчёт запускается при выборе из списка, а не на каждую букву.
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x =>
    x.setAttribute("aria-selected", x === b));
  if (LAST) render(LAST);
});
["lf","fare","month","alt","lease","hours","seatsv"].forEach(id =>
  document.getElementById(id).addEventListener("input", draw));
boot();
</script></body></html>
