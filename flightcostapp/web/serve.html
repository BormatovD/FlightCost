<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fca — расчёт маршрута</title>
<!-- Оформление читается из ui.css: токены, шрифт, цвета происхождения.
     Здесь только вёрстка этой страницы. Hex-литералов в этом файле быть
     не должно — см. tests/test_ui.py. -->
<link rel="stylesheet" href="ui.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Маршрут выбирается в шапке, а не в левой колонке: код на глобусе и
   код в поле выбора были в разных системах (ИАТА на карте, ИКАО в
   поле), и глаз бегал между тремя местами. Теперь пара «откуда — куда»
   стоит над глобусом одной строкой, в тех же кодах, что подписи точек. */
header{border-bottom:1px solid var(--line);padding:8px 20px;display:flex;
 gap:12px;align-items:center;flex:none;flex-wrap:wrap}
header b{font:600 16px/1 var(--sans);margin-right:6px}
header .hp{position:relative}
/* Переключатель языка: три кнопки, нажатая — цветом акцента. */
#langs{display:inline-flex;gap:2px;margin-left:10px}
header a.legal{font:11px var(--sans);color:var(--faint);margin-left:10px;text-decoration:none}
header a.legal:hover{color:var(--ink);text-decoration:underline}
#langs button{font:12px var(--sans);padding:3px 6px;background:none;color:var(--dim);
 border:1px solid var(--line);border-radius:4px;cursor:pointer}
#langs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
header .hp input,header select,header .hp input:focus{width:210px;font:14px var(--sans);
 padding:6px 9px;background:var(--raise);color:var(--dim);border:1px solid var(--line);
 border-radius:5px;outline:0}
header .hp input:focus{color:var(--ink);border-color:var(--accent)}
/* Поле, которое заполнит следующий щелчок по глобусу. */
header .hp input.next{border-style:dashed;border-color:var(--accent)}
header select{width:auto}
header .hp .hits{min-width:340px}
header .arrow{color:var(--faint);font-size:15px}
header select{font:14px var(--sans);padding:6px 8px}
header span{color:var(--dim);font-size:13px}
header .sp{margin-left:auto;color:var(--faint);font-size:12px}
/* Три колонки: вход, глобус, ответ. Глобус НЕ прокручивается — колесо
   над ним приближает. Прокрутка и зум на одном жесте спорят, и спор
   выигрывает тот, кто не ожидался: страница уезжала вниз вместо
   приближения. */
.cols{flex:1;display:grid;grid-template-columns:250px minmax(320px,1fr) 440px;
 min-height:0}
.right{border-left:1px solid var(--line);background:var(--panel);
 display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* Вкладки переносятся во второй ряд, а не уезжают за край: прокрутка
   полосы вкладок на Mac не видна, и шестая вкладка в немецкой витрине
   оказалась недоступной вовсе. Подписи разной длины на трёх языках —
   переменная величина, перенос выдерживает любую. */
.tabs{flex:none;display:flex;flex-wrap:wrap;column-gap:2px;padding:0 14px;
 border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;white-space:nowrap;
 color:var(--dim);padding:11px 8px 9px;font:14px var(--sans);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
/* Горизонтальной прокрутки в ответе нет: она пряталась под шторкой
   вкладки и обнаруживалась только колёсиком. Что не влезает — переносится
   (первый столбец) или укладывается в карточку (сравнение). */
.tabbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 18px 60px;min-height:0}
.tabbody table{width:100%;max-width:100%}
/* Таблица с примечаниями: третий столбец — текст, он переносится, а не
   обрезается. Общее правило nowrap — для чисел, не для прозы. */
.tabbody table.wrap td{white-space:normal}
.tabbody table.wrap td.v{white-space:nowrap}
.tabbody td,.tabbody .v{white-space:nowrap}
.tabbody td:first-child{white-space:normal}
.pane{overflow-y:auto;padding:18px 20px 60px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line);background:var(--panel)}
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column;
 background:var(--ocean);min-width:0}
/* Главные числа — над глобусом, а не в глубине правой колонки: стоимость
   рейса, безубыточный чек, CASK и полоса перевозчиков. Ответ виден до
   того, как открыта хоть одна вкладка. */
/* Ширина по содержимому: у чека и CASK по две строки сравнения, у
   выбора перевозчика — два поля друг над другом. */
.kpi{flex:none;display:grid;grid-template-columns:1fr 1.45fr 1.45fr .95fr;
 border-bottom:1px solid var(--line);background:var(--bg)}
.kpi>div{padding:9px 14px 8px;border-right:1px solid var(--line);min-width:0}
.kpi>div:last-child{border-right:0}
.kpi .k{font-size:11.5px;color:var(--dim)}
.kpi .n{font:600 20px/1.2 var(--sans);font-variant-numeric:tabular-nums;
 margin-top:2px;white-space:nowrap}
.kpi .n small{font:400 12px var(--sans);color:var(--dim);margin-left:4px}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.35}
.kpi .bad{color:var(--guess)}
.kpi .cmp{color:var(--dim);margin-top:4px}
.kpi .cmp b{font-weight:600;color:var(--ink)}
.kpi .cpick{display:flex;flex-direction:column;gap:4px;margin-top:4px;position:relative}
.kpi .cpick input,.kpi .cpick select{width:100%;min-width:0;background:var(--raise);
 color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 7px;
 font:12.5px var(--sans)}
.kpi .cpick .hits{min-width:260px;max-height:200px}
.kpi .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chipb{background:none;border:1px solid var(--line);color:var(--dim);
 border-radius:4px;padding:2px 7px;font:12px var(--sans);cursor:pointer}
.chipb[aria-pressed=true]{border-color:var(--doc);color:var(--ink)}
.chipb b{font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
/* Сравнение с перевозчиком — карточка, а не таблица на шесть столбцов:
   шесть столбцов в 440 px и давали горизонтальную прокрутку. */
.carrier{border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:8px}
.carrier .ch{font:600 13.5px var(--sans)}
.carrier .cs{color:var(--faint);font-size:11px;margin-bottom:6px;
 overflow-wrap:anywhere}
.carrier .kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12.5px}
.carrier .kv span{color:var(--dim)}
.carrier .kv b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.carrier .kv i{display:block;font-style:normal;color:var(--faint);font-size:11px}
.gwrap{position:relative;flex:1;min-height:0;display:flex}
#globe{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.gfoot{flex:none;padding:8px 14px 12px;background:var(--bg);
 border-top:1px solid var(--line)}
@media (max-width:1180px){
  .cols{grid-template-columns:230px minmax(280px,1fr) 360px}
}
.grp2{font:600 11.5px/1 var(--sans);letter-spacing:.06em;color:var(--dim);
 margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp2:first-child{margin-top:0}
.tabs2{display:flex;gap:4px;margin-bottom:9px}
.tabs2 button{flex:1;background:var(--panel);border:1px solid var(--line);
 color:var(--dim);border-radius:5px;padding:4px 6px;font:12px var(--sans);cursor:pointer}
.tabs2 button[aria-selected=true]{border-color:var(--accent);color:var(--ink)}
.pick{width:100%}
/* Крестик очистки у текстовых и числовых полей. Значение стирается
   одним нажатием, а не выделением всего набранного; поле после этого в
   фокусе — у выбора аэропорта или типа сразу открывается список.
   Стрелки числовых полей убраны: они занимали то же место и всё равно
   не годились для сумм в сотни тысяч. */
.cl{position:relative;display:block}
.cl input{padding-right:26px !important}
.cl .clx{position:absolute;right:4px;top:50%;transform:translateY(-50%);
 width:20px;height:20px;border:0;border-radius:3px;background:none;
 color:var(--faint);font:16px/1 var(--sans);cursor:pointer;display:none;padding:0}
.cl.has .clx{display:block}
.cl .clx:hover{color:var(--ink);background:var(--select)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field.pair > div{position:relative}
.hits{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:3px;
 background:var(--panel);border:1px solid var(--accent);border-radius:5px;
 max-height:290px;overflow-y:auto;display:none;box-shadow:0 12px 28px rgba(0,0,0,.55)}
.hits.on{display:block}
.hit{padding:6px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line2)}
.hit:last-child{border-bottom:0}
.hit.sel,.hit:hover{background:var(--select)}
.hit b{font:600 12.5px var(--sans);color:var(--doc);margin-right:7px}
.hit i{font-style:normal;color:var(--faint);font-size:11.5px;display:block}
.hit .t3{color:var(--param)}
.hit.dead{color:var(--faint);cursor:not-allowed}
.hit.dead b{color:var(--faint)}
#achits{min-width:300px}
.btn{width:100%;padding:7px 9px;font:14px var(--sans);background:var(--raise);
 color:var(--ink);border:1px solid var(--line);border-radius:5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
#tform input[readonly]{color:var(--dim)}
#tform .grp{margin:14px 0 6px;font-size:11.5px;color:var(--faint);border-bottom:1px solid var(--line);padding-bottom:4px}
/* Порог — не таблица на пять колонок: в 440 px они не помещаются, и
   «не хватает 1 797 EUR за рейс» в колонке без переносов уезжало за
   экран. Строка на параметр: имя и три числа в ряд, осязаемое — второй
   строкой на всю ширину, с переносами. */
.mrow{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:2px 10px;
 padding:9px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.mrow .ml b{font-weight:600}
.mrow .ml span,.mrow .cap{display:block;color:var(--faint);font-size:11px}
.mrow .mv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .mv .cap{text-align:right;white-space:normal;overflow-wrap:break-word}
.mrow .mt{grid-column:1/-1;color:var(--dim);font-size:12px;white-space:normal;
 overflow-wrap:break-word}
.mrow .mt.bad{color:var(--warn)}
.mhead{display:grid;grid-template-columns:1.25fr 1fr 1fr .8fr;gap:10px;
 color:var(--dim);font-size:11.5px;font-weight:600;padding:0 0 6px;
 border-bottom:1px solid var(--line)}
.mhead span{text-align:right} .mhead span:first-child{text-align:left}
header #seatsv{font:14px var(--sans);padding:6px 9px;background:var(--raise);
 color:var(--ink);border:1px solid var(--line);border-radius:5px;outline:0}
header #seatsv:focus{border-color:var(--accent)}
#layout{max-width:190px}

/* Шторка: выезжает снизу поверх глобуса, закрывается по Esc и по крестику. */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;
 background:rgba(22,22,22,.985);border-top:1px solid var(--accent);
 box-shadow:0 -14px 34px rgba(0,0,0,.55);
 transform:translateY(101%);transition:transform .16s ease-out;z-index:30}
.sheet.on{transform:translateY(0)}
.sheetbody{overflow-y:auto;max-height:72vh;padding:14px 18px 20px}
.oc{fill:var(--ocean);stroke:var(--ocean-line);stroke-width:1.1}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.55;pointer-events:none}
.zone{fill:var(--zone-f);stroke:var(--zone-line);stroke-width:.65;
 /* Указатель ловит ТОЛЬКО границу зоны, не заливку: иначе полигон
    Исландии накрывает все точки внутри себя, и навести на аэропорт
    внутри зоны нельзя. Граница остаётся подсказкой, точки — главным. */
 pointer-events:stroke}
.zone.hit{fill:var(--zone-hit-f);stroke:var(--zone-hit-line);stroke-width:1.2;
 /* Верхний слой не ловит указатель: наведение на аэропорт внутри
    выделенной зоны важнее, чем наведение на саму зону. */
 pointer-events:none}
.arc{fill:none;stroke:var(--route);stroke-width:2.2;stroke-linecap:round;
 /* Дуга рисуется последней, поверх всего, и её обводка накрывала точки
    на концах маршрута: навести на аэропорт вылета было НЕЛЬЗЯ. Дуге
    наведение не нужно — она подписана сама. */
 pointer-events:none}
.arc.halo{stroke:var(--route-halo);stroke-width:5.5;opacity:.8}
.apt{cursor:pointer}
.apt.sel{fill:var(--doc);stroke:var(--ink2);stroke-width:1.6}
.aptlbl{fill:var(--ink);font:600 11px var(--sans);pointer-events:none;
 paint-order:stroke;stroke:var(--ocean);stroke-width:3px}
.arclbl{pointer-events:none;fill:var(--route);font:600 12px var(--sans);pointer-events:none;
 paint-order:stroke;stroke:var(--ocean);stroke-width:4px;text-anchor:middle}
.arclbl.sub{fill:var(--route-sub);font-weight:400;font-size:11px}
.arclbl.bad{fill:var(--warn)}
.arc.bad{stroke:var(--warn);stroke-dasharray:7 5}
.gtools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.gtools button{background:rgba(22,22,22,.9);border:1px solid var(--line);
 color:var(--dim);border-radius:5px;padding:4px 9px;font:12px var(--sans);cursor:pointer}
.gtools button:hover{color:var(--ink);border-color:var(--accent)}
.gtools button[aria-pressed=true]{color:var(--ink);border-color:var(--accent)}
/* Слой зон отключается кнопкой: без него глобус — суша, точки и маршрут.
   Класс на svg, а не перерисовка: globe.js про оформление не знает. */
#globe.nozones .zone{display:none}
.gpop{position:absolute;background:rgba(22,22,22,.97);border:1px solid var(--line);
 border-radius:9px;padding:11px 14px;pointer-events:none;min-width:210px;
 /* Ширина ограничена: список пропущенных статей у Франкфурта — семь
    кодов, и плашка растягивалась на весь кадр. */
 max-width:290px;
 box-shadow:0 12px 30px rgba(0,0,0,.6);z-index:10}
.ac-h{font:600 14px var(--sans);color:var(--ink)}
.ac-h b{color:var(--doc)}
.ac-n{color:var(--dim);font-size:12px;margin:1px 0 8px}
.ac-t{width:100%;border-collapse:collapse;font-size:12.5px}
.ac-t td{padding:2px 0;color:var(--dim);border:0}
.ac-t td.v{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;
 white-space:nowrap;padding-left:14px}
.ac-bad{color:var(--warn)}
.ac-sum td{border-top:1px solid var(--line);padding-top:6px;color:var(--ink)}
.ac-f{color:var(--faint);font-size:11.5px;margin-top:7px}
.apt.other{fill:none}
.apt.t1{fill:var(--doc);stroke:none;opacity:.95}
.apt.t3{fill:none;stroke:var(--guess);stroke-width:1.1;opacity:.8}
.apt.obs{stroke:var(--obs);stroke-width:1.4}
.apt.sel{fill:var(--doc);stroke:var(--ink2);stroke-width:1.8}
.glegend{display:flex;gap:16px;font-size:11.5px;color:var(--faint);margin-top:7px}
.glegend span{display:flex;align-items:center;gap:5px}
.glegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.gnote{font-size:12px;color:var(--faint);margin-top:7px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:5px;padding:7px 9px;font:14px var(--sans)}
.field input:focus,.field select:focus{border-color:var(--accent);outline:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv{display:flex;justify-content:space-between;font:12px var(--sans);color:var(--dim)}
.hero{display:flex;gap:30px;align-items:flex-end;flex-wrap:wrap;
 padding-bottom:14px;border-bottom:1px solid var(--line)}
.cap{font-size:12.5px;color:var(--dim);margin-bottom:4px}
.big{font:400 40px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--dim);margin-left:4px}
.verdict{font-size:13px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);
 color:var(--dim);margin-bottom:6px}
.verdict.bad{color:var(--warn);border-color:var(--guess)}
h3{font:600 13.5px/1.3 var(--sans);margin:22px 0 8px}
.lede{color:var(--dim);font-size:12.5px;margin:-4px 0 10px}
.stack{display:flex;height:30px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:12px;color:var(--dim);margin-top:9px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;
 padding:0 9px 6px 0;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:5px 9px 5px 0;border-bottom:1px solid var(--line2);vertical-align:top}
td.v{text-align:right;font-variant-numeric:tabular-nums}
tr.sel td,tr:hover td.v{background:var(--select)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.step{display:grid;grid-template-columns:30px 1fr 120px;gap:10px;padding:7px 0;
 border-bottom:1px solid var(--line2);align-items:baseline;cursor:pointer}
.step:hover,.step.sel{background:var(--select)}
.step .n{color:var(--faint);font:11.5px var(--sans)}
.step .f{font:11.5px var(--mono);color:var(--faint);margin-top:2px}
.step .val{text-align:right;font:13px var(--sans);font-variant-numeric:tabular-nums}
.step .src{color:var(--doc);font-size:11px}
.grp{margin:16px 0 2px;font-size:11.5px;color:var(--faint);
 border-bottom:1px solid var(--line);padding-bottom:4px}
.close{float:right;cursor:pointer;color:var(--faint);font:16px var(--sans)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:8px 0}
.kv dt{color:var(--dim)} .kv dd{margin:0;font-variant-numeric:tabular-nums;
 /* `break-all` рвал слова посреди буквы: «конечный о / статок». Слово
    переносится целиком, а рвётся только то, что иначе не влезает — путь
    или ключ без пробелов. */
 overflow-wrap:break-word;word-break:normal;hyphens:none}
</style></head><body>
<header><b>fca</b>
  <div class="hp"><input id="o" class="pick" autocomplete="off" placeholder="откуда — код или название" title="Откуда">
    <div class="hits" id="oh"></div></div>
  <span class="arrow">→</span>
  <div class="hp"><input id="d" class="pick" autocomplete="off" placeholder="куда — код или название" title="Куда">
    <div class="hits" id="dh"></div></div>
  <!-- Тип ВС — из хранилища, а не из четырёх зашитых <option>: тот же
       класс дефекта, что 170 кресел в коде. Поиск по подстроке, как у
       аэропортов; ярус расхода виден до расчёта. -->
  <div class="hp"><input id="ac" class="pick" autocomplete="off" placeholder="тип ВС — код или название" title="Тип ВС" style="width:200px">
    <div class="hits" id="achits"></div></div>
  <!-- Компоновка — отдельное положение: типовая · перевозчика · по

<script type="module">
import { orthographic, gcd, gcPoint, crossing, fitZoom }
  from "./geo.js";
import { createGlobe } from "./globe.js";

// ── языки ───────────────────────────────────────────────────────────────
// Каталог вшивается сервером (`_page`): ключ — русская фраза, значение —
// перевод. Нет перевода — показывается русский оригинал, а не пустота и
// не технический ключ: так перевод можно вводить частями.
//
// Язык: ?lang= → сохранённый выбор → язык браузера → английский. Смена
// языка перезагружает страницу: подписи, собранные при загрузке модуля
// (словари статусов, ярусов, статей), строятся заново на новом языке.
//
// Шаги разбора и предупреждения порождает ядро на Python — они пока
// по-русски; во вкладке «Разбор» об этом сказано.
//
// Имя `_t`, а не `t`: в витрине `t` — частое имя локальной переменной
// (тип самолёта, строка таблицы), и внутри таких функций вызов перевода
// обращался к объекту и падал. Первая версия так и сломала запуск.
const I18N = /*I18N*/{}/*/I18N*/;
const LANGS = ["ru", "en", "de"];
const LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) { try { localStorage.setItem("fca.lang", q); } catch (e) {} return q; }
  let saved = null;
  try { saved = localStorage.getItem("fca.lang"); } catch (e) {}
  if (LANGS.includes(saved)) return saved;
  for (const l of (navigator.languages || [navigator.language || ""])) {
    const p = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(p)) return p;
  }
  return "en";
})();
const LOCALE = {ru: "ru-RU", en: "en-GB", de: "de-DE"}[LANG];
const I18N_MISS = new Set();
function _t(s) {
  if (LANG === "ru") return s;
  const key = String(s).replace(/\s+/g, " ").trim();
  const v = (I18N[LANG] || {})[key];
  if (v == null) {
    if (!I18N_MISS.has(key)) { I18N_MISS.add(key); console.debug("i18n: нет перевода", LANG, key); }
    return s;
  }
  return v;
}
// Статическая разметка: подписи, кнопки, подсказки. Переводится один раз
// при загрузке — то, что рисует скрипт, уже прошло через t().
function translateStatic(root) {
  if (LANG === "ru") return;
  document.documentElement.lang = LANG;
  document.title = _t(document.title);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const raw = n.nodeValue, key = raw.replace(/\s+/g, " ").trim();
    if (!key || !/[А-Яа-яЁё]/.test(key)) continue;
    const v = _t(key);
    if (v !== key) n.nodeValue = raw.replace(raw.trim(), v);
  }
  for (const el of root.querySelectorAll("[placeholder],[title],[aria-label]")) {
    for (const at of ["placeholder", "title", "aria-label"]) {
      const val = el.getAttribute(at);
      if (val && /[А-Яа-яЁё]/.test(val)) el.setAttribute(at, _t(val));
    }
  }
}
translateStatic(document.body);
for (const b of document.querySelectorAll("#langs button")) {
  b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
  b.onclick = () => {
    try { localStorage.setItem("fca.lang", b.dataset.lang); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.delete("lang");
    location.replace(u.toString());
  };
}

const $ = s => document.querySelector(s);
// Цвета происхождения — только имена переменных из ui.css, hex здесь нет.
const PROV = {store:"var(--doc)", derived:"var(--calc)", input:"var(--user)",
  override:"var(--override)", "default":"var(--guess)", fleet:"var(--guess)",
  estimated:"var(--guess)"};
const RU = {store:_t("из документа"), derived:_t("вычислено"), input:_t("задано вами"),
  override:_t("задано вами"), "default":_t("заготовка"), fleet:_t("заготовка"),
  estimated:_t("параметрика")};
// Округление ДО ЦЕЛОГО годится для сумм и врёт на всём остальном:
// цена топлива 0,78 EUR/кг показывалась как «1», блок-время 2,12 ч как
// «2», доля 0,07 как «0». Разряд выбирается по величине, а не один на
// всё: у денег он не тот, что у коэффициента.
// Два знака в той же локали, что f0: «4,74», а не «4.74» рядом с «1 503».
const f2 = n => Number(n).toLocaleString(LOCALE, {minimumFractionDigits: 2,
                                                  maximumFractionDigits: 2});
const f0 = n => {
  if (n == null) return "—";
  const a = Math.abs(n);
  const d = a === 0 ? 0 : a < 1 ? 3 : a < 10 ? 2 : a < 100 ? 1 : 0;
  // Минимум НУЛЕВОЙ: «95,0 EUR» и «589,9 nm» читаются хуже, чем «95» и
  // «590», а «0,78» и «2,12» — лучше, чем «1» и «2». Разряд нужен там,
  // где он несёт смысл, и мешает там, где не несёт.
  return n.toLocaleString(LOCALE, {minimumFractionDigits: 0,
                                    maximumFractionDigits: d})
          .replace(/\u00a0/g, " ");
};
const esc = s => String(s ?? "").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

for (let m=1;m<=12;m++) $("#month").insertAdjacentHTML("beforeend",`<option>${m}</option>`);

// Крестик очистки: у каждого текстового и числового поля. Обёртка не
// трогает обработчики поля — стирание шлёт то же событие `input`, что и
// набор, и пересчёт запускается тем же путём.
function addClears(root = document) {
  root.querySelectorAll('input[type="text"],input[type="number"],input:not([type])')
      .forEach(inp => {
    if (inp.closest(".cl")) return;
    const box = document.createElement("span");
    box.className = "cl" + (inp.value ? " has" : "");
    // В шапке поля лежат в `.hp` с позиционированием под список
    // подсказок — обёртка встаёт внутрь, а не вместо.
    inp.parentNode.insertBefore(box, inp);
    box.appendChild(inp);
    const x = document.createElement("button");
    x.type = "button"; x.className = "clx"; x.textContent = "×";
    x.title = _t("очистить"); x.tabIndex = -1;
    // mousedown, а не click: у полей выбора blur по click закрыл бы список
    // раньше, чем он нужен, и вернул бы прежнее значение.
    x.addEventListener("mousedown", e => {
      e.preventDefault();
      inp.value = "";
      box.classList.remove("has");
      inp.focus();
      inp.dispatchEvent(new Event("input", {bubbles: true}));
    });
    box.appendChild(x);
    inp.addEventListener("input", () => box.classList.toggle("has", !!inp.value));
  });
}
// Значение, выставленное кодом (setPick, setAc), крестик не увидит без
// события — поэтому у полей выбора состояние обновляется отсюда.
function markClear(inp) {
  const box = inp.closest(".cl");
  if (box) box.classList.toggle("has", !!inp.value);
}

let APTS = [], ACS = [];
// Какой конец маршрута ставит следующий щелчок по глобусу.
let NEXT = "o";
function markNext() {
  $("#o").classList.toggle("next", NEXT === "o");
  $("#d").classList.toggle("next", NEXT === "d");
  if (window.__note) window.__note();          // подпись под глобусом
}
// `op` — режим компоновки: `*` типовая, код перевозчика, `max` по
// сертификату, `own` своё число кресел (поле рядом).
const CHOSEN = {o: null, d: null, ac: "A320", op: "*"};

// Поиск по ПОДСТРОКЕ, а не по началу: «форт» находит Франкфурт, «шере» —
// Шереметьево. Искать по первым буквам удобно только тому, кто уже знает
// точное название — то есть никому.
function search(q, n = 12) {
  const s = q.trim().toLowerCase();
  if (!s) return APTS.slice(0, n);
  const starts = [], inside = [];
  for (const a of APTS) {
    const i = a.find.indexOf(s);
    if (i < 0) continue;
    // Совпадение с начала слова важнее совпадения в середине: «BER»
    // должен сначала дать Берлин, а потом Абердин.
    (i === 0 || a.find[i - 1] === " " ? starts : inside).push(a);
    if (starts.length >= n) break;
  }
  return starts.concat(inside).slice(0, n);
}

// Код, которым аэропорт подписан ВЕЗДЕ: в поле, в списке, на глобусе,
// в шапке. ИАТА, где он есть; иначе ИКАО — ключ вида «источник:id» не
// показывается (решение 103). ИКАО остаётся рядом второй строкой:
// расчёт и тариф ключуются им, и пользователь должен его видеть.
function code(a) { return a.key && a.key.length === 3 ? a.key : a.icao; }
function aptLabel(a) { return `${code(a)} — ${(a.tr && a.tr.ru) || a.name}`; }

function hitRow(a) {
  // Ярус данных виден в списке: пользователь узнаёт, что тарифа нет, до
  // расчёта, а не из предупреждения после.
  return `<div class="hit" data-icao="${esc(a.icao)}" data-key="${esc(a.key)}">
    <b>${esc(code(a))}</b>${esc(a.tr && a.tr.ru || a.name)}
    <i>${esc(a.icao)} · ${esc(a.iso)}${a.tier === 1 ? "" :
      (' · ' + '<' + 'span class=' + '"' + 't3' + '"' + '>' + _t("тарифа нет, ярус 3") + '<' + '/span' + '>')}</i></div>`;
}

function bindPick(id, hid) {
  const inp = $("#" + id), box = $("#" + hid);
  let cur = -1;
  const show = () => {
    const list = search(inp.value);
    box.innerHTML = list.map(hitRow).join("") ||
      `<div class="hit" style="color:var(--dim)">${_t("ничего не нашлось")}</div>`;
    box.classList.add("on"); cur = -1;
    box.querySelectorAll(".hit[data-key]").forEach(el =>
      el.addEventListener("mousedown", e => { e.preventDefault(); pick(el); }));
  };
  const pick = el => {
    CHOSEN[id] = el.dataset.key;
    const a = APTS.find(x => x.key === el.dataset.key);
    inp.value = aptLabel(a); markClear(inp);
    box.classList.remove("on");
    NEXT = id === "o" ? "d" : "o"; markNext();
    drawCtx(); draw();
  };
  inp.addEventListener("focus", () => { inp.select(); show(); });
  inp.addEventListener("input", show);
  inp.addEventListener("blur", () => setTimeout(() => {
    box.classList.remove("on");
    // Поле, в котором осталось «гатв», выглядит как выбор и им не
    // является: расчёт идёт по CHOSEN, а человек видит свой набор.
    // Возвращаем подпись выбранного — несоответствие показанного
    // посчитанному это тот же класс, что подпись не той величины.
    if (CHOSEN[id]) setPick(id, (APTS.find(x => x.key === CHOSEN[id]) || {}).icao);
  }, 140));
  inp.addEventListener("keydown", e => {
    const items = [...box.querySelectorAll(".hit[data-key]")];
    if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((x, i) => x.classList.toggle("sel", i === cur));
      items[cur].scrollIntoView({block: "nearest"});
    } else if (e.key === "Enter") {
      e.preventDefault(); pick(items[cur < 0 ? 0 : cur]);
    } else if (e.key === "Escape") { box.classList.remove("on"); }
  });
  return inp;
}

function setPick(id, icao) {
  const a = APTS.find(x => x.icao === icao) || APTS[0];
  CHOSEN[id] = a.key;
  $("#" + id).value = aptLabel(a);
  markClear($("#" + id));
}

// ── тип ВС ──────────────────────────────────────────────────────────
function acLabel(t) {
  // Как у аэропортов: код и имя. Кресла стоят в шапке справа и в
  // селекторе компоновки — здесь они повторялись бы третий раз.
  return `${t.icao}${t.name ? ` — ${t.name}` : ""}`;
}
function acTier(t) {
  // Три состояния, не два: физика есть / нет / не проверялось.
  if (t.physics === null) return _t("физика не проверялась");
  return t.physics ? _t("ярус 1, физика") : _t("без физики: ярус 3/4, параметрика");
}
// Поиск по СЛОВАМ, а не по подстроке целиком: «airbus 320» — два слова,
// и оба должны найтись в строке типа («a320 airbus a320 airbusa320»).
// Дефисы и пробелы в запросе не считаются: «737-800», «737 800» и
// «737800» — один и тот же запрос.
function acSearch(q, n = 14) {
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean)
    .map(w => w.replace(/-/g, ""));
  const fits = t => words.every(w => t.find.includes(w) || t.find.replace(/-/g, "").includes(w));
  const list = words.length ? ACS.filter(fits) : ACS.slice();
  // Порядок: точный код, затем код с набранного, затем слово имени с
  // набранного, затем короткое имя раньше длинного — «320» даёт A320
  // перед A320neo, а «neo» — A320neo.
  const score = t => {
    const code = t.icao.toLowerCase(), nm = (t.name || "").toLowerCase().split(/[\s-]+/);
    if (words.some(w => w === code)) return 3;
    if (words.some(w => code.startsWith(w))) return 2;
    if (words.some(w => nm.some(x => x.startsWith(w)))) return 1;
    return 0;
  };
  return list.sort((a, b) => score(b) - score(a)
                           || (a.name || a.icao).length - (b.name || b.icao).length
                           || a.icao.localeCompare(b.icao)).slice(0, n);
}
function acRow(t) {
  return `<div class="hit${t.usable ? "" : " dead"}" data-ac="${esc(t.icao)}">
    <b>${esc(t.icao)}</b>${esc(t.name || "")}
    <i>${t.usable ? esc(acTier(t)) : (_t("нельзя:") + " ") + esc(t.why_not)}${
      t.layouts.length ? ` · ${_t("компоновок")} ${t.layouts.length}` : (" " + _t("· компоновки нет, типовые кресла"))}${
      t.physics === false ? (' · ' + '<' + 'span class=' + '"' + 't3' + '"' + '>' + _t("параметрика") + '<' + '/span' + '>') : ""}</i></div>`;
}
function bindAcPick() {
  const inp = $("#ac"), box = $("#achits");
  let cur = -1;
  const show = () => {
    box.innerHTML = acSearch(inp.value).map(acRow).join("") ||
      `<div class="hit" style="color:var(--dim)">${_t("такого типа в хранилище нет")}</div>`;
    box.classList.add("on"); cur = -1;
    box.querySelectorAll(".hit[data-ac]").forEach(el =>
      el.addEventListener("mousedown", e => { e.preventDefault(); pick(el); }));
  };
  const pick = el => {
    const t = ACS.find(x => x.icao === el.dataset.ac);
    if (!t || !t.usable) return;          // «нельзя» — не выбирается
    setAc(t.icao); box.classList.remove("on"); draw();
  };
  inp.addEventListener("focus", () => { inp.select(); show(); });
  inp.addEventListener("input", show);
  inp.addEventListener("blur", () => setTimeout(() => {
    box.classList.remove("on"); setAc(CHOSEN.ac);
  }, 140));
  inp.addEventListener("keydown", e => {
    const items = [...box.querySelectorAll(".hit[data-ac]")];
    if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((x, i) => x.classList.toggle("sel", i === cur));
      items[cur].scrollIntoView({block: "nearest"});
    } else if (e.key === "Enter") { e.preventDefault(); pick(items[cur < 0 ? 0 : cur]); }
    else if (e.key === "Escape") { box.classList.remove("on"); }
  });
}
function setAc(icao) {
  const t = ACS.find(x => x.icao === icao) || ACS.find(x => x.usable) || ACS[0];
  if (!t) return;
  const changed = CHOSEN.ac !== t.icao;
  CHOSEN.ac = t.icao;
  $("#ac").value = acLabel(t);
  markClear($("#ac"));
  $("#ac").title = `${t.icao}${t.name ? " — " + t.name : ""} · ${acTier(t)}`;
  if (changed || !$("#layout").options.length) drawLayouts(t);
}
// Компоновка: типовая (`*`) и перевозчика — из хранилища через
// `operator`; по сертификату и своя — числом кресел через вход `seats`
// ядра. Положение без данных (нет `seats_max` у типа) выключено с
// причиной, а не спрятано.
function drawLayouts(t) {
  const ops = t.layouts.filter(l => l.operator !== "*");
  const def = t.layout_default;
  const opts = [];
  opts.push(`<option value="*">${def ? `${_t("типовая")} · ${def.seats}` :
    `${_t("типовая из справочника")}${t.seats_typical ? " · " + t.seats_typical : ""}`}</option>`);
  for (const l of ops) opts.push(`<option value="${esc(l.operator)}">${esc(l.operator)} · ${l.seats}</option>`);
  opts.push(t.seats_max
    ? `<option value="max">${_t("по сертификату")} · ${t.seats_max}</option>`
    : `<option disabled title="${_t("в домене aircraft нет seats_max для этого типа")}">${_t("по сертификату — нет seats_max")}</option>`);
  opts.push(`<option value="own">${_t("своя")}</option>`);
  const sel = $("#layout");
  sel.innerHTML = opts.join("");
  const keep = CHOSEN.op === "own" || (CHOSEN.op === "max" && t.seats_max)
            || ops.some(l => l.operator === CHOSEN.op);
  sel.value = keep ? CHOSEN.op : "*";
  CHOSEN.op = sel.value;
  sel.title = ops.length ? _t("компоновка: типовая, перевозчика, по сертификату или своя")
                         : _t("компоновок перевозчиков по этому типу в хранилище нет");
  $("#seatsv").style.display = CHOSEN.op === "own" ? "" : "none";
}
// Кресла, которые уйдут в запрос: число только у двух положений.
function seatsParam() {
  if (CHOSEN.op === "max") return (ACS.find(x => x.icao === CHOSEN.ac) || {}).seats_max || "";
  if (CHOSEN.op === "own") return $("#seatsv").value || "";
  return "";
}

// ── глобус ──────────────────────────────────────────────────────────
// Проекция считается ЗДЕСЬ, в браузере, и существует в одной реализации
// (решение 97): питон отдаёт широту и долготу. Вторая реализация той же
// математики на сервере разошлась бы с первой так же молча, как разошлись
// два отпечатка состава.
let GEO = null, G = null, PROJ = null;

async function bootGlobe(){
  GEO = await (await fetch("/api/geo")).json();
  PROJ = orthographic({cx: 310, cy: 310, radius: 284, lat: 45, lon: 10});
  G = createGlobe({svg: $("#globe"), proj: PROJ, data: {
    zones: GEO.zones, land: GEO.land,
    // Точки передаются в форме, которую ждёт globe.js: [шир, долг, имя, ярлык]
    airports: visibleAirports()},
    // Ярус данных виден на карте: закрашенная точка — тариф разобран,
    // контур — параметрика. Это и есть та «витрина над данными» из
    // целевого образа: карта показывает не географию, а состояние сбора.
    aptClass: icao => {
      const a = GEO.airports[icao];
      return !a ? "" : (a.tier === 1 ? "t1" : "t3") + (a.seen ? " obs" : "");
    }});
  G.draggable();
  // Колесо над глобусом ПРИБЛИЖАЕТ. Без `preventDefault` браузер
  // прокручивает страницу, и вместо карты уезжает вёрстка — жест один,
  // а толкований два, и выигрывает не тот.
  $("#globe").addEventListener("wheel", ev => {
    ev.preventDefault();
    const st = PROJ.state;
    const next = Math.min(9, Math.max(1, (st.zoom || 1) * (ev.deltaY < 0 ? 1.14 : 1 / 1.14)));
    PROJ.setZoom(next);
    drawGlobe();
  }, {passive: false});
  $("#globe").addEventListener("mouseleave",
    () => { $("#gpop").style.display = "none"; });
  G.on("hover", e => {
    const el = $("#gpop");
    // Наведение приходит и на точку, и на зону. Раньше для зоны
    // печаталось голое `e.id` — код вроде «LS» или «00» в чёрной плашке
    // посреди карты, который ничего не значит для смотрящего. Код без
    // подписи это не подсказка, а ребус.
    let txt = "", html = "";
    if (e.kind === "airport") {
      html = airportCard(e.id);
    } else if (e.kind === "zone") {
      const z = GEO.zones[e.id];
      const nm = (z && z.n || "").trim();
      txt = `${_t("зона")} ${e.id}${nm ? " · " + nm : (" " + _t("· название не указано в источнике"))}`;
    }
    if (!txt && !html) { el.style.display = "none"; return; }
    el.style.display = "block";
    if (html) el.innerHTML = html; else el.textContent = txt;
    // Плашка держится внутри колонки: у правого края она уезжала за
    // границу и обрезалась.
    const box = $("#gwrap").getBoundingClientRect();
    el.style.left = Math.min(e.x + 14, box.width - el.offsetWidth - 10) + "px";
    el.style.top = Math.min(e.y + 14, box.height - el.offsetHeight - 10) + "px";
  }).on("leave", () => { $("#gpop").style.display = "none"; })
   .on("pick", e => {
      // Щелчки ПО ОЧЕРЕДИ: первый — откуда, второй — куда, третий снова
      // откуда. Прежде щелчок менял только назначение, и отправление
      // приходилось набирать в поле. Какой конец следующий — видно в
      // подсказке под глобусом и по рамке поля в шапке; выбор в поле
      // переводит очередь на другой конец.
      if (e.kind !== "airport") return;
      const other = NEXT === "o" ? "d" : "o";
      if (e.id === CHOSEN_ICAO(other)) return;      // один аэропорт на оба конца нельзя
      setPick(NEXT, e.id); NEXT = other;
      markNext(); drawCtx(); draw();
   });
  $("#gnote").textContent = GEO.missing.length
    ? (_t("подложки нет:") + " ") + GEO.missing.join("; ")
    : "";
  markNext();
  updateNote();
  $("#gfit").onclick = () => { fitRoute(); };
  // Размер колонки меняется вместе с окном, и глобус обязан следовать.
  new ResizeObserver(() => drawGlobe()).observe($("#globe"));
  function updateNote(){
    const shown = Object.keys(G.shown()).length;
    const all = Object.keys(GEO.airports).length;
    $("#gnote").textContent = GEO.missing.length
      ? (_t("подложки нет:") + " ") + GEO.missing.join("; ")
      : `${_t("щелчок по точке")} — ${NEXT === "o" ? _t("откуда") : _t("куда")} · `
        + `${_t("показано")} ${shown} ${_t("из")} ${all} ${_t("аэропортов — приблизьте, чтобы увидеть")} `
        + `${_t("остальные · порядок по наблюдённым рейсам, не по пассажиропотоку")} `
        + `${_t("(его ещё нет)")}`;
  }
  window.__note = updateNote;
  $("#gall").onclick = () => { G.whole(); drawGlobe(); };
  // Слой зон: кнопка переключает класс на svg, оформление прячет слой.
  // Состояние живёт в aria-pressed — читается и человеком, и стилем.
  $("#gzones").onclick = () => {
    const on = $("#gzones").getAttribute("aria-pressed") !== "true";
    $("#gzones").setAttribute("aria-pressed", String(on));
    $("#globe").classList.toggle("nozones", !on);
  };
}

// ── уровни показа точек ─────────────────────────────────────────────
// Семьсот точек на глобусе — это не карта, а шум: разглядеть нельзя ни
// одну. Показываем столько, сколько помещается по РАЗМЕРУ ТОЧКИ НА
// ЭКРАНЕ, а не по произвольному числу: при десятикратном приближении
// видимая площадь та же, а мира в кадре в сто раз меньше.
//
// Порядок важности — наблюдённые рейсы. Пассажиропотока у нас пока нет,
// он приходит на M10; до тех пор ранжируем измеренным, а не выдуманным.
// Когда поток появится, здесь меняется одна строка.
const LOD_BASE = 26;        // точек на целом глобусе

function lodLimit(){
  const z = (PROJ && PROJ.state && PROJ.state.zoom) || 1;
  // Площадь кадра падает как квадрат приближения, значит столько же
  // точек на единицу площади — это z² раз больше точек в кадре.
  return Math.round(LOD_BASE * z * z);
}

function visibleAirports(){
  const all = Object.entries(GEO.airports).filter(([, a]) => a.lat != null);
  const keep = new Set([CHOSEN_ICAO("o"), CHOSEN_ICAO("d")]);
  // Концы маршрута, разобранные тарифы и перечень владельца видны
  // ВСЕГДА: первое потому что это ответ на заданный вопрос, второе и
  // третье потому что карта показывает состояние сбора — что заведено и
  // что ещё предстоит. Остальные точки ранжируются по наблюдённым
  // рейсам, а наблюдений в России у OpenSky нет: без этой строки все
  // тридцать один российский аэропорт перечня сортировались последними
  // и на карту не попадали ни на каком приближении.
  for (const [k, a] of all) if (a.tier === 1 || a.watch) keep.add(k);
  const rest = all
    .filter(([k]) => !keep.has(k))
    .sort((x, y) => (y[1].flights || 0) - (x[1].flights || 0))
    .slice(0, Math.max(0, lodLimit() - keep.size));
  const out = {};
  for (const [k, a] of all)
    if (keep.has(k) || rest.some(r => r[0] === k))
      out[k] = [a.lat, a.lon, a.name, a.iata];
  return out;
}

// Плашка аэропорта. Разбивку сборов показываем ТОЛЬКО для концов
// текущего маршрута: у остальных её пришлось бы считать отдельным
// запросом на каждое наведение, а ответ был бы «ярус 3» у семисот из
// семисот семи. Для них плашка показывает СОСТОЯНИЕ ДАННЫХ — что есть,
// чего нет и что появится. Это честнее пустой таблицы и полезнее с
// первого дня.
function airportCard(icao){
  const a = GEO.airports[icao];
  if (!a) return esc(icao);
  const head = `<div class="ac-h"><b>${esc(a.iata)}</b> · ${esc(icao)}</div>
    <div class="ac-n">${esc(a.name)}</div>`;
  const ends = LAST ? [LAST.route.origin, LAST.route.destination] : [];
  const mine = LAST && (ends.includes(a.iata) || ends.includes(icao));
  if (mine && LAST.charge_lines) {
    const pref = Object.keys(LAST.charge_lines)
      .filter(k => k.startsWith(icao + "/"));
    if (pref.length) {
      const rows = pref
        .map(k => [k.split("/")[1], LAST.charge_lines[k]])
        .sort((x, y) => y[1] - x[1]);
      const sum = rows.reduce((s, r) => s + r[1], 0);
      const gaps = (LAST.charge_gaps || {})[icao] || {};
      const lost = (gaps.lost_codes || []).concat(gaps.missing_data || []);
      return head + `<table class="ac-t"><tbody>` + rows.map(r =>
        `<tr><td>${esc(CODE_RU[r[0]] || r[0])}</td>
         <td class="v">${f0(r[1])}</td></tr>`).join("")
        + (lost.length ? `<tr><td class="ac-bad">${esc(
             lost.length > 3 ? lost.slice(0, 3).join(", ") + ` ${_t("и ещё")} ${
               lost.length - 3}` : lost.join(", "))}</td>
             <td class="v ac-bad">${_t("не начислено")}</td></tr>` : "")
        + `<tr class="ac-sum"><td>${_t("всего")}</td><td class="v">${f0(sum)} EUR</td></tr>
        </tbody></table>`;
    }
  }
  // Не конец маршрута либо тарифа нет: показываем состояние сбора.
  return head + `<table class="ac-t"><tbody>
    <tr><td>${_t("тариф")}</td><td class="v">${a.tier === 1
      ? _t("разобран") : ('<' + 'span class=' + '"' + 'ac-bad' + '"' + '>' + _t("нет, ярус 3") + '<' + '/span' + '>')}</td></tr>
    <tr><td>${_t("наблюдений")}</td><td class="v">${a.flights
      ? a.flights + (" " + _t("рейсов")) : _t("нет")}</td></tr>
    <tr><td>${_t("в перечне")}</td><td class="v">${a.watch ? _t("да") : _t("нет")}</td></tr>
    </tbody></table>${mine ? "" :
    `<div class="ac-f">${_t("щёлкните, чтобы посчитать маршрут сюда")}</div>`}`;
}

// Подписи кодов сборов — те же, что в разборе. Держать здесь второй
// словарь значило бы завести расхождение: перевод один, мест два.
const CODE_RU = {
  landing: _t("посадка"), landing_pax: _t("посадка, пасс."), landing_invest: _t("посадка, инвест. часть"),
  landing_night: _t("посадка, ночная надбавка"), pbb: _t("телетрап"), bhs: _t("багажная система"),
  passenger: _t("пассажирский"),
  security: _t("безопасность"), prm: _t("маломобильные"), noise: _t("шум"),
  noise_program: _t("программа шума"), parking: _t("стоянка"),
  parking_pier: _t("стоянка у трапа"), gh_infra: _t("наземная инфраструктура"),
  gh_infra_pax: _t("инфраструктура, пасс."), gh_infra_dg: _t("инфраструктура, опасные"),
  aerodrome: _t("аэродромное"), meteo: _t("метео"), border: _t("пограничный"),
  demand: _t("сбор за спрос"), municipal_tax: _t("муниципальная надбавка"),
};

const CHOSEN_ICAO = id => (APTS.find(x => x.key === CHOSEN[id]) || {}).icao;

function routePts(){
  const a = GEO.airports[CHOSEN_ICAO("o")], b = GEO.airports[CHOSEN_ICAO("d")];
  return (a && b && a.lat != null && b.lat != null)
    ? [[a.lat, a.lon], [b.lat, b.lon]] : null;
}

function fitRoute(){
  const pts = routePts();
  if (pts && G) { G.frame(pts[0], pts[1]); drawGlobe(); }
}

function fitViewBox(){
  // viewBox подгоняется под КОЛОНКУ: она не квадратная, и рисовать в
  // квадрат значило бы обрезать глобус сверху или оставить пустоту по
  // бокам. Центр проекции двигается вместе с ней.
  const el = $("#globe"), w = el.clientWidth, hgt = el.clientHeight;
  if (!w || !hgt) return;
  el.setAttribute("viewBox", `0 0 ${w} ${hgt}`);
  const st = PROJ.state;
  st.cx = w / 2; st.cy = hgt / 2;
  st.radius = Math.min(w, hgt) / 2 - 12;
}

function drawGlobe(){
  if (!G) return;
  fitViewBox();
  // Набор точек пересчитывается на каждую перерисовку: приближение
  // меняется перетаскиванием и колесом, и список обязан следовать за ним.
  G.setAirports(visibleAirports());
  const pts = routePts();
  // Пересечение зон считается в браузере ради отклика при вращении, и
  // это ОБЪЯВЛЕННОЕ дублирование `airspace.py` (решение 102), а не
  // случайное: показ здесь, а проверка — в разборе маршрута.
  const hit = pts ? crossing(pts[0], pts[1], GEO.zones) : {};
  if (window.__note) window.__note();
  G.draw({
    highlight: hit,
    selected: [CHOSEN_ICAO("o"), CHOSEN_ICAO("d")],
    // Подпись дуги отвечает на вопрос «что за рейс», а не «сколько
    // миль»: пассажиры и тип — то, ради чего считают, а невыполнимость
    // обязана быть видна НА КАРТЕ, а не только в колонке справа
    // (решение 93). Расстояние уходит во вторую строку.
    route: pts ? {a: pts[0], b: pts[1],
                  label: LAST
                    ? (LAST.answer.feasible
                        ? `${f0(LAST.answer.max_pax != null
                              ? Math.min(LAST.inputs.pax ?? 1e9,
                                         LAST.answer.max_pax)
                              : (LAST.inputs.pax ?? 0))} ${_t("пассажиров на")} ${
                           esc(LAST.route.aircraft)}`
                        : (_t("нельзя:") + " ") + esc((LAST.answer.feasibility||{}).why
                                           || _t("предел")))
                    : `${Math.round(gcd(pts[0], pts[1]))} nm`,
                  sub: LAST
                    ? `${Math.round(gcd(pts[0], pts[1]))} nm · ${
                        Object.keys(hit).length} ${_t("зон")}`
                    : `${Object.keys(hit).length} ${_t("зон")}`,
                  bad: LAST ? !LAST.answer.feasible : false} : null});
}

async function boot(){
  [APTS, ACS] = await Promise.all([
    fetch("/api/airports").then(r => r.json()),
    fetch("/api/aircraft").then(r => r.json())]);
  bindPick("o", "oh"); bindPick("d", "dh"); bindAcPick();
  addClears();
  setPick("o", "EDDF"); setPick("d", "LEBL"); setAc("A320");
  $("#layout").addEventListener("change", () => {
    CHOSEN.op = $("#layout").value;
    const own = CHOSEN.op === "own";
    $("#seatsv").style.display = own ? "" : "none";
    if (own && !$("#seatsv").value) {
      // Пустое поле «своя» считалось бы по компоновке и выглядело бы
      // как своё число. Подставляем типовые кресла и даём поправить.
      const t = ACS.find(x => x.icao === CHOSEN.ac) || {};
      $("#seatsv").value = (t.layout_default || {}).seats || t.seats_typical || "";
      markClear($("#seatsv")); $("#seatsv").focus();
    }
    draw();
  });
  drawCtx();
  await bootGlobe();
  fitRoute();
  // Первая отрисовка глобуса идёт ДО расчёта, и подпись дуги тогда не
  // знает ни пассажиров, ни выполнимости. Расчёт её обновит сам —
  // `draw` зовёт `drawGlobe` по приходе ответа.
  draw();
}

// Условия начисления — порядковые номера ВНУТРИ аэропорта: тройка у
// Франкфурта значит категорию 3, у Дублина QC 0,5, у Гатвика Chapter 14.
// В справочнике их нет, поэтому задаёт человек — и по каждому концу
// отдельно: одно значение на весь маршрут неверно, как только концов два.
const CTX = [
  {k:"noise_cat",   n:_t("Категория шума"),        t:"number", hint:"1-16"},
  {k:"ac_class",    n:_t("Класс наземного обсл."), t:"number", hint:"0-6"},
  {k:"stand_group", n:_t("Группа стоянки"),        t:"number", hint:"1-9"},
  {k:"stand",       n:_t("Место"),                 t:"select", opts:["", "pier", "apron"]},
  {k:"operator",    n:_t("Эксплуатант"),           t:"select", opts:["", "national", "foreign"],
                    lbl:{national:_t("свой (национальный)"), foreign:_t("иностранный")}},
  {k:"terminal",    n:_t("Терминал"),              t:"text",   hint:_t("буква или цифра")},
  {k:"park_h",      n:_t("Стоянка, ч"),            t:"number", hint:_t("часы")},
];
const ctxVal = {};
let ctxAt = null;

function ctxAirports(){ return [CHOSEN.o, CHOSEN.d].filter(Boolean); }

function drawCtx(){
  const aps = ctxAirports();
  if (!aps.length) return;
  if (!aps.includes(ctxAt)) ctxAt = aps[0];
  $("#ctxtabs").innerHTML = aps.map(a =>
    `<button data-ap="${esc(a)}" aria-selected="${a === ctxAt}">${esc(a)}</button>`).join("");
  $("#ctxtabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { ctxAt = b.dataset.ap; drawCtx(); });
  const cur = ctxVal[ctxAt] || {};
  $("#ctxfields").innerHTML = CTX.map(f => f.t === "select"
    ? `<div class="field"><label>${esc(f.n)}</label>
        <select data-ctx="${f.k}">${f.opts.map(o =>
          `<option value="${o}" ${cur[f.k] === o ? "selected" : ""}>${
            (f.lbl && f.lbl[o]) || o || _t("не задано")}</option>`).join("")}</select></div>`
    : `<div class="field"><label>${esc(f.n)}</label>
        <input data-ctx="${f.k}" type="${f.t === "text" ? "text" : "number"}"
          placeholder="${esc(f.hint || "")}" maxlength="${f.t === "text" ? 1 : 6}"
          value="${cur[f.k] ?? ""}"></div>`).join("");
  $("#ctxfields").querySelectorAll("[data-ctx]").forEach(el =>
    el.addEventListener("input", () => {
      const box = ctxVal[ctxAt] || (ctxVal[ctxAt] = {});
      if (el.value === "") delete box[el.dataset.ctx];
      else box[el.dataset.ctx] = el.value;
      draw();
    }));
  addClears($("#ctxfields"));
  const n = aps.reduce((s, a) => s + Object.keys(ctxVal[a] || {}).length, 0);
  $("#ctxwho").textContent = n ? ` · ${_t("задано")} ${n}` : "";
}

function params(){
  const sets = [];
  for (const [ap, box] of Object.entries(ctxVal))
    for (const [k, v] of Object.entries(box))
      if (v !== "") sets.push(`charge_context.${ap}.${k}=${v}`);
  // Перевозчик уходит в `operator` только когда компоновка его; при «по
  // сертификату» и «своей» кресла идут числом, а эксплуатант — типовой.
  const carrier = !["*", "max", "own"].includes(CHOSEN.op);
  const p = {origin:CHOSEN.o, destination:CHOSEN.d,
    ac:CHOSEN.ac, operator:carrier ? CHOSEN.op : "*", seats:seatsParam(),
    lf:(+$("#lf").value/100).toFixed(2),
    fare:$("#fare").value||"", month:$("#month").value,
    alt:$("#alt").value||""};
  // Прямые значения вместо режима отнесения. Три режима были ответом на
  // вопрос «как распределить лизинг», а спрашивать надо две величины, из
  // которых распределение и получается. «Борт уже оплачен» выражается
  // нулевым лизингом, «выделенный борт» — своим числом часов.
  if ($("#lease").value !== "") sets.push(
    `fleet_economics.${CHOSEN.ac}.lease_eur_month=${$("#lease").value}`);
  if ($("#hours").value !== "") sets.push(
    `fleet_economics.${CHOSEN.ac}.monthly_hours=${$("#hours").value}`);
  if (sets.length) p.set = sets.join("~");
  return new URLSearchParams(p);
}

let timer = null, seq = 0;
function draw(){
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const my = ++seq;
    $("#lfv").textContent = $("#lf").value + "%";
    // Пройденная часть дорожки — от минимума, не от нуля.
    const lf = $("#lf");
    lf.style.setProperty("--p", (lf.value - lf.min) / (lf.max - lf.min) * 100);
    const t0 = performance.now();
    const r = await (await fetch("/api/route?" + params())).json();
    if (my !== seq) return;                 // ответ обогнал более свежий
    $("#stat").textContent = `${Math.round(performance.now()-t0)} ${_t("мс")}`;
    drawGlobe();
    if (r.error) { $("#main").innerHTML =
      `<div class="note"><b>${_t("Отказ расчёта.")}</b> ${esc(r.error)}</div>`; return; }
    render(r);
  }, 120);
}

let LAST = null;

// Причина «нельзя» — из пределов, которые называет ядро (решение 93).
// Поле `why` в ответе не существовало: страница читала его и всегда
// показывала общее «рейс невыполним».
function whyNot(a){
  const lim = (a.feasibility && a.feasibility.limits) || [];
  return lim.map(l => l.text).filter(Boolean).join("; ") || _t("рейс невыполним");
}

function render(r){
  LAST = r;
  // Коды и тип уже стоят в полях слева от этой подписи — не повторяем.
  $("#hdr").textContent = `${f0(r.route.distance_nm)} ${_t("nm · блок")} ${
    f2(r.route.block_h)} ${_t("ч")} · ${r.route.pax} ${_t("из")} ${r.route.seats} ${_t("кресел")}`;
  drawKpi(r);
  const tab = document.querySelector("#tabs [aria-selected=true]").dataset.tab;
  $("#main").innerHTML = ({route: tabRoute, trace: tabTrace,
                           solve: tabSolve, types: tabTypes, type: tabType,
                           data: tabData}[tab] || tabRoute)(r);
  if (tab === "route") drawBench(r);
  if (tab === "solve") drawSolve(r);
  if (tab === "types") drawTypes(r);
  if (tab === "type") drawType(r);
  document.querySelectorAll(".step").forEach(el =>
    el.addEventListener("click", () => side(el.dataset)));
}

// Предупреждения приходят из ядра языком командной строки. Переписываем
// на той поверхности, где показываем, а не в ядре: иначе CLI потеряет
// свою подсказку.
const FLAG_RU = [
  [/\s*\(--month\)/g, (" " + _t("(поле «Месяц» слева)"))],
  [/\s*\(--alternate-nm\)/g, (" " + _t("(поле «До запасного аэродрома»)"))],
  [/подставь свои через --set/g, _t("подставьте свои в блоке «Флот» слева")],
  [/через --set charge_context\.[^\s]+/g, _t("в блоке «Условия начисления» слева")],
  [/--set\s+charge_context\.[^\s]+/g, _t("поля блока «Условия начисления»")],
];
const human = w => FLAG_RU.reduce((s, [re, to]) => s.replace(re, to), w);

function tabRoute(r){

  let h = `<div class="hero">
    <div><div class="cap">${_t("Безубыточный чек")}</div>
      <div class="big num">${dead
        ? `<span style="font-size:26px;color:var(--warn)">${_t("нельзя")}</span>`
        : f0(a.breakeven_fare_eur) + "<small>EUR</small>"}</div></div>
    <div><div class="cap">${_t("Задан")}</div><div class="big num" style="color:var(--dim)">${
      f0(fare)}<small>EUR</small></div></div>
    <div><span class="verdict${dead||gap>0.5?" bad":""}">${
      dead ? esc(whyNot(a))
           : gap>0.5 ? `${_t("не хватает")} ${f0(gap)} ${_t("с пассажира")}`
                     : `${_t("запас")} ${f0(-gap)} ${_t("с пассажира")}`}</span></div>
  </div>`;
  h += `<h3>${_t("Из чего складывается рейс")}</h3>
    <p class="lede">${_t("Штриховка — параметрическая заготовка, а не документ. Сейчас")} ${Math.round(r.default_share*100)}% ${_t("суммы.")}</p>
    <div class="stack">` + r.cost.map(c =>
      `<i style="width:${c.eur/tot*100}%;background:${PROV[c.prov]||"var(--param)"}"
        class="${["default","fleet","estimated"].includes(c.prov)?"hatch":""}"
        title="${esc(c.label||c.item)}: ${f0(c.eur)}"></i>`).join("") + `</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--doc)"></i>${_t("из документа")}</span>
      <span><i class="sw" style="background:var(--calc)"></i>${_t("вычислено моделью")}</span>
      <span><i class="sw hatch" style="background:var(--param)"></i>${_t("заготовка")}</span>
      <span><i class="sw" style="background:var(--user)"></i>${_t("задано вами")}</span>
    </div>
    <table style="margin-top:10px"><tbody>` + r.cost.map(c =>
      `<tr><td><i class="dot" style="background:${PROV[c.prov]||"var(--param)"}"></i>${

       <td class="v" style="color:var(--dim)">${(c.eur/tot*100).toFixed(1)}%</td></tr>`)
      .join("") + `<tr><td><b>${_t("Итого")}</b></td><td class="v"><b>${f0(tot)}</b></td>
        <td class="v" style="color:var(--dim)">${
          f2(tot/(r.route.seats*km)*100)} ${_t("ц / кресло-км")}</td></tr></tbody></table>`;
  if (r.warnings.length) h += `<h3>${_t("Внимание")}</h3>` + r.warnings.map(w =>
    `<div class="note quiet"><b>·</b> ${esc(human(w))}</div>`).join("");
  h += `<h3>${_t("С чем сравнить")}</h3><div id="benchbox"><p class="lede">${_t("считаю…")}</p></div>`;

function tabTrace(r){
  // Пояснения из строк УБРАНЫ: они дублировали шторку и растягивали
  // каждую строку на три. Строка теперь одна, а «почему» открывается
  // щелчком — внизу, там, куда человек и смотрит на карту.
  let h = `<p class="lede">${_t("Щёлкните по шагу — внизу откроется, из чего он получен и на каком факте стоит.")}</p>`;
  if (LANG !== "ru")
    h += `<div class="note quiet">${_t("Шаги разбора и предупреждения пока на русском: их порождает расчётное ядро, перевод — следующий этап.")}</div>`;
  let grp = "";
  for (const s of r.trace) {
    if (s.group !== grp) { grp = s.group; h += `<div class="grp">${esc(grp)}</div>`; }
    h += `<div class="step" data-node="${esc(s.node)}" data-src="${esc(s.src)}"
        data-ref="${esc(s.ref || "")}" data-label="${esc(s.label)}"
        data-formula="${esc(s.formula||"")}" data-subst="${esc(s.subst||"")}">
      <span class="n">${s.n}</span><div>${esc(s.label)}</div>
      <span class="val">${s.value==null?"—":f0(s.value)} <span
        style="color:var(--faint);font-size:11px">${esc(s.unit)}</span></span>
    </div>`;
  }
  return h;
}

function tabSolve(r){
  // Разметка без чисел: пороги считаются отдельным запросом секунды,
  // а не миллисекунды, и грузятся ПОСЛЕ отрисовки вкладки — как полоса
  // перевозчиков на «Маршруте».
  return `<p class="lede">${_t("Порог: при каком значении параметра рейс выходит в ноль при заданном чеке. Считается обращением модели численно — минимумы, полосы по массе и ступени стоянки дают изломы, поэтому кривой здесь нет и гладкость не обещается.")}</p>
    <div id="solvebox"><p class="lede">${_t("считаю пороги…")}</p></div>`;
}

// Пороги грузятся один раз на набор входов и переиспользуются, пока
// входы не изменились: семь параметров по тридцать прогонов каждый —
// это секунды, и гонять их на каждый сдвиг ползунка нельзя.
// Запросы к порогу идут СТРОГО по одному: сервер держит один замок, и
// пять сдвигов ползунка дали бы пять трёхсекундных расчётов в очереди,
// из которых нужен последний. Устаревший запрос не отправляется вовсе.
let SOLVE = null, SOLVE_KEY = "", SOLVE_SEQ = 0, SOLVE_BUSY = null;
async function loadSolve(my){
  if (SOLVE_BUSY) await SOLVE_BUSY;
  if (my !== SOLVE_SEQ) return null;           // есть запрос новее
  const key = params().toString();
  if (SOLVE && SOLVE_KEY === key) return SOLVE;
  const t0 = performance.now();
  SOLVE_BUSY = fetch("/api/solve?" + key).then(x => x.json());
  try {
    const s = await SOLVE_BUSY;
    s.ms = Math.round(performance.now() - t0);
    SOLVE = s; SOLVE_KEY = key;
    return s;
  } finally { SOLVE_BUSY = null; }
}

async function drawSolve(r){
  const box = $("#solvebox");
  if (!box) return;
  const my = ++SOLVE_SEQ;
  const s = await loadSolve(my);
  if (!s || my !== SOLVE_SEQ || !$("#solvebox")) return;   // устарело или вкладку сменили
  if (s.error) { box.innerHTML = `<div class="note"><b>${_t("Отказ.")}</b> ${esc(s.error)}</div>`; return; }
  if (!s.rows.length) { box.innerHTML = `<div class="note"><b>${_t("Порогов нет.")}</b> ${esc(s.why || "")}</div>`; return; }
  const a = r.answer, fare = +$("#fare").value || 0;
  const deficit = a.breakeven_fare_eur - fare > 0.5;
  const STATUS = {
    ok:          deficit ? _t("до нуля") : _t("запас"),
    unreachable: _t("недостижимо"),
    failed:      _t("не сошлось"),
  };
  let h = `<div class="note quiet"><b>${deficit
      ? _t("Маршрут убыточен при заданном чеке.") : _t("Маршрут прибылен при заданном чеке.")}</b>
    ${deficit ? _t("Порог — насколько надо улучшить параметр, чтобы выйти в ноль.")
              : _t("Порог — насколько параметр может ухудшиться, прежде чем рейс уйдёт в ноль.")}
    ${_t("Считалось")} ${s.ms} ${_t("мс")}${s.inputs && s.inputs.month ? `, ${_t("месяц")} ${s.inputs.month}` : ""}.</div>
    <div class="mhead"><span>${_t("параметр")}</span><span>${_t("сейчас")}</span><span>${_t("порог")}</span><span>${_t("запас")}</span></div>`;
  for (const m of s.rows) {
    const unr = m.status === "unreachable", bad = m.status === "failed";
    // Порог показывается ТОЛЬКО у `ok`. У недостижимого на его месте
    // «нет», а граница области и недобор на ней — в строке осязаемого:
    // это другая величина, и ставить её в колонку порога значило бы
    // выдать границу за порог.
    const edge = m.status === "ok" ? f0(m.edge)
      : `<span style="color:var(--warn)">${unr ? (m.inert ? _t("не влияет") : _t("нет")) : "—"}</span>`;
    const margin = m.status === "ok"
      ? `${m.margin_pct > 0 ? "+" : ""}${f0(m.margin_pct)}%` : "—";
    let tail = "", tailBad = false;
    if (m.status === "ok") tail = m.hint_edge ? `${_t("на пороге")}: ${esc(m.hint_edge)}` : "";
    else if (unr && m.inert) tail = esc(m.note);
    else if (unr) {
      tailBad = true;
      // Граница — осязаемым, если оно есть: «170 из 170 кресел» читается,
      // «1 доля» — нет.
      tail = `${_t("даже на границе")} — ${esc(m.limit_about)}${m.hint_limit ? `, ${esc(m.hint_limit)}`
          : m.limit != null ? `, ${f0(m.limit)} ${esc(m.unit)}` : ""} — ${
          m.gap_at_limit == null ? _t("недобор не посчитан")
          : (m.gap_at_limit < 0 ? (_t("не хватает") + " ") : (_t("остаётся") + " ")) + f0(Math.abs(m.gap_at_limit)) + (" " + _t("EUR за рейс"))}`;
    } else { tailBad = true; tail = esc(m.note || _t("расчёт не сошёлся")); }
    h += `<div class="mrow" title="${esc([m.about, m.split].filter(Boolean).join(" · "))}">
      <div class="ml"><b>${esc(m.label)}</b><span>${esc(m.unit)} · ${STATUS[m.status]}</span></div>
      <div class="mv">${m.now == null ? "—" : f0(m.now)}${m.hint_now
        ? `<span class="cap">${esc(m.hint_now)}</span>` : ""}</div>
      <div class="mv"${bad ? ' style="color:var(--warn)"' : ""}>${edge}</div>
      <div class="mv">${margin}</div>
      ${tail ? `<div class="mt${tailBad ? " bad" : ""}">${tail}</div>` : ""}</div>`;
  }
  const lt = s.lease_terms || {};
  h += `<p class="lede" style="margin-top:12px">${_t("Стоимость борта у ставки лизинга — прикидка по допущениям договора")}: ${lt.months} ${_t("мес.")}, ${
    (lt.annual_rate * 100).toFixed(1)}% ${_t("годовых, остаток")} ${
    Math.round(lt.balloon_share * 100)}% ${_t("стоимости, платёж")} ${
    lt.in_advance ? _t("авансом") : _t("в конце периода")}. ${_t("Меняются через")}
    <span class="num">--set lease_terms.*</span>.</p>
    <p class="lede">${_t("Ставка ТОиР и экипажа решаются по почасовой части, а показана полная ставка при этом плече: при нулевой почасовой части остаётся цикловая — шасси, ВСУ, линейное обслуживание, — и это пол, ниже которого ставка не опускается. Порог по цене топлива — за килограмм в крыло; сейчас в модели спот без дифференциала и заправки.")}</p>`;
  box.innerHTML = h;
}

function tabTypes(r){

let TYPES = null, TYPES_KEY = "", TYPES_SEQ = 0, TYPES_BUSY = null;
async function loadTypes(my){
  if (TYPES_BUSY) await TYPES_BUSY;
  if (my !== TYPES_SEQ) return null;
  const p = params(); p.set("pax", String(PAX_CMP ?? (LAST && LAST.route.pax) ?? ""));
  const key = p.toString();
  if (TYPES && TYPES_KEY === key) return TYPES;
  const t0 = performance.now();
  TYPES_BUSY = fetch("/api/compare?" + key).then(x => x.json());
  try {
    const s = await TYPES_BUSY;
    s.ms = Math.round(performance.now() - t0);
    TYPES = s; TYPES_KEY = key;
    return s;
  } finally { TYPES_BUSY = null; }
}

      <div class="mv">${ok ? Math.round(t.lf * 100) + "%" : `<span style="color:var(--warn)">${STATUS[t.status]}</span>`}</div>

            : `<div class="mt">CASK ${f2(t.cask)} ${_t("ц/кресло-км · топливо")} ${f0(t.fuel_per_pax)} ${_t("кг/пасс · блок")} ${
                f2(t.block_h)} ${_t("ч · на заготовке")} ${Math.round(t.default_share * 100)}%${
                t.unused && t.unused.length ? ` · <span style="color:var(--warn)">${_t("переопределения флота не применены")}</span>` : ""}</div>`}
    </div>`;
  }
  h += `<p class="lede" style="margin-top:12px">${_t("Ярус расхода: физика — openap; аналог — вычислитель аналога на своём планере с якорем; заготовка — плоская ставка. Типы без модели расхода отвечают «нельзя» (решение 106), а не числом.")}</p>`;
  box.innerHTML = h;
}

// ── тип ─────────────────────────────────────────────────────────────

    ${editing ? `<div class="field pair" style="margin-top:10px">

      <div>${TYPE_NEW ? `<button id="tcancel" class="btn">${_t("Отмена")}</button>`

    <div id="tmsg" class="note quiet" style="display:none"></div>

  if (!TYPE_NEW && t.layouts && t.layouts.length)
    h += `<div class="grp">${_t("компоновки")}</div>` + t.layouts.map(l =>
      `<div class="mrow" style="grid-template-columns:1.4fr .9fr 2fr"><div class="ml"><b>${
        esc(l.operator === "*" ? _t("типовая") : l.operator)}</b></div><div class="mv">${l.seats} ${_t("кр.")}</div>
        <div class="mv" style="text-align:left">${esc(l.source)}</div></div>`).join("");

    m.innerHTML = bad ? `<b>${_t("Не сохранено.")}</b> ${esc(text)}` : esc(text); };
  if ($("#newgo")) $("#newgo").onclick = () => {
